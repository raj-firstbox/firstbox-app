name: Build Firstbox

# To publish new installers: raise "version" in package.json, push to main, then run this workflow
# (Actions › Build Firstbox › Run workflow) with "Publish a release" ticked. A tag vX.Y.Z also works.
# Every push to main also publishes the page online (when the repository is public),
# so the installed apps pick up changes without reinstalling.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release with the installers'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  web:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run prepare-web
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deploy
        uses: actions/deploy-pages@v4

  app:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm install --no-audit --no-fund
      - run: npm run prepare-web
      - name: Build and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then T=--mac; else T=--win; fi
          if [[ "$GITHUB_REF" == refs/tags/v* || "${{ inputs.publish }}" == "true" ]]; then P=always; else P=never; fi
          npx electron-builder $T --publish $P
      - name: Check the app starts
        shell: bash
        run: npm install --no-save --no-audit --no-fund playwright-core@1.48.2 && node tools/smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firstbox-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/smoke-*.png
          if-no-files-found: warn
