<title>Firstbox Costing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: white app with a Halloween-orange brand bar; a costing is a column of five numbered calculators with a sticky jump bar, beside a sticky totals panel (stacks on phones). Single light theme by design: Firstbox brand is white + orange. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#FFF4ED; --line:#EEE2DA; --fg:#1F1A16; --muted:#6B6058;
  --brand:#EB6123; --brand-strong:#D4531A; --accent:#B8470F; --accent-ink:#FFFFFF; --accent-soft:#FDEBDF;
  --good:#1C7743; --good-soft:#E0F1E7; --bad:#B3322A; --bad-soft:#F7E3E1; --warn:#7A5A00; --warn-soft:#FBF1D2;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{overflow-anchor:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--brand)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;margin-right:8px}
.brand img{display:block;height:42px;width:auto}
.bar .tab{white-space:nowrap}
.setwrap{position:relative}
/* Home tiles */
.brand.home-link{cursor:pointer}
#view-home{max-width:1000px;margin:0 auto}
.on-home .bar{display:none}
.hhero{position:relative;display:grid;justify-items:center;text-align:center;gap:4px;padding:18px 0 0}
.hlogo{width:min(260px,64vw);height:auto;margin-bottom:18px}
.hhero h1{font-size:22px}
.hhero .note{font-size:14px}
.hsignout{position:absolute;top:0;right:0}
.hdivider{border:0;height:1px;background:var(--line);margin:26px 0 22px;position:relative;overflow:visible}
.hdivider::after{content:"";position:absolute;left:50%;top:-1px;width:56px;height:3px;margin-left:-28px;background:var(--brand);border-radius:2px}
.hsub{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.hsub::after{content:"";flex:1;height:1px;background:var(--line)}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.hgrid.work{grid-template-columns:repeat(4,1fr)}
@media (max-width:1000px){.hgrid.work{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.hgrid,.hgrid.work{grid-template-columns:1fr}}
.htile{display:flex;align-items:center;gap:16px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;font:inherit;color:var(--fg);cursor:pointer;min-height:108px;transition:box-shadow .15s,border-color .15s,transform .15s}
.htile:hover,.htile:focus-visible{border-color:var(--brand);box-shadow:0 8px 24px rgba(31,26,22,.08);transform:translateY(-1px)}
.htile:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hicon{flex:none;display:grid;place-items:center;width:50px;height:50px;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.htext{display:grid;gap:3px}
.htitle{font-family:var(--font-display);font-weight:700;font-size:19px}
.hdesc{font-size:13.5px;color:var(--muted);line-height:1.4}
.htile.small{min-height:84px;padding:14px 16px}
.htile.small .hicon{width:40px;height:40px;border-radius:10px}
.htile.small .htitle{font-size:16px}
.rowdel{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border:1px solid transparent;border-radius:6px;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;font-weight:600;white-space:nowrap}
.rowdel:hover,.rowdel:focus-visible{color:var(--neg,#B42318);border-color:var(--line);background:var(--surface)}
.rowdel.armed{color:#fff;background:#B42318;border-color:#B42318}
td.act,th.act{width:1%;text-align:right;padding-left:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.setbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.setbtn:hover,.setbtn[aria-expanded="true"]{color:var(--accent);border-color:var(--brand);background:var(--accent-soft)}
.setbtn.on{color:var(--accent);background:var(--accent-soft);border-color:var(--brand)}
.setmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:20;min-width:280px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:8px;box-shadow:0 10px 30px rgba(31,26,22,.14);padding:6px;display:grid;gap:2px}
.setmenu[hidden]{display:none}
.setmenu-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}
.setmenu button{display:grid;gap:2px;text-align:left;background:none;border:0;border-radius:6px;padding:9px 10px;font:inherit;cursor:pointer;color:var(--fg)}
.setmenu button b{font-size:15px;font-weight:600}
.setmenu button span{font-size:12px;color:var(--muted)}
.setmenu button:hover,.setmenu button:focus-visible{background:var(--accent-soft)}
.setmenu button[aria-current="page"] b{color:var(--accent)}
.brand-sub{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:10px}
.tslogo{display:block;height:40px;width:auto;margin-bottom:6px}
.bar nav{display:flex;gap:4px}
.tab{background:none;border:0;padding:9px 14px;border-radius:6px;font:inherit;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 -3px 0 var(--brand)}
.tab:hover{color:var(--fg)}
.spacer{flex:1}
.savestate{font-size:12px;color:var(--muted)}
.savestate.err{color:var(--bad)}
main{padding-block:20px 60px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:6px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand-strong);border-color:var(--brand-strong);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:var(--brand);border-color:var(--brand)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{padding:4px 9px;font-size:13px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
input[type=number]{text-align:right}
textarea{width:100%;resize:vertical;min-height:60px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin-bottom:16px;font-weight:500}
.banner.err{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}

/* Jobs view */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:8px;padding:12px 14px}
.kpi .v{font-family:var(--font-display);font-size:22px;font-weight:600;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
td.n,th.n{text-align:right}
tbody tr:last-child td{border-bottom:0}
.jobs tbody tr{cursor:pointer}
.jobs tbody tr:hover{background:var(--accent-soft)}
.jobno{font-weight:600}
.sub{font-size:12px;color:var(--muted);white-space:normal;max-width:280px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.pill.Quoted{background:var(--accent-soft);color:var(--accent)}
.pill.Confirmed{background:var(--warn-soft);color:var(--warn)}
.pill.Completed{background:var(--good-soft);color:var(--good)}
.pill.Lost{background:var(--bad-soft);color:var(--bad)}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:middle}
.empty{padding:28px;text-align:center;color:var(--muted)}
.newjob{background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:14px;margin-bottom:16px;display:grid;gap:12px}
.newjob .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* Job sheet */
.sheet{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:920px){.sheet{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.details .wide{grid-column:span 2}
@media (max-width:420px){.details .wide{grid-column:span 1}}
.lines{display:grid;gap:10px;margin-top:10px}
.line{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px}
.line-top{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.line-top .name{flex:1 1 200px}
.line-top .name input{width:100%;font-weight:600}
.line-top .rsel{flex:0 1 230px}
.line-top .rsel select{width:100%}
.ctype{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.fields{display:flex;flex-wrap:wrap;gap:8px}
.fields input{width:92px}
.fields select{max-width:220px}
.line-foot{display:flex;gap:10px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}
.detail{font-size:12px;color:var(--muted);flex:1 1 220px}
.amt{text-align:right}
.amt .fl{display:block}
.amt b{font-size:16px;font-family:var(--font-display);font-weight:600}
.actual input{width:110px}
.adds{display:flex;flex-wrap:wrap;gap:6px}
.adds .btn{border:1px dashed var(--brand);color:var(--accent);background:var(--surface)}
.adds .btn:hover{background:var(--accent-soft)}
.part{display:grid;gap:10px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--barh, 58px) + 76px)}
.part-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--brand);padding-bottom:8px;margin-top:10px}
.part-title{display:flex;gap:12px;align-items:flex-start;min-width:0}
.pnum{flex:none;width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;font-family:var(--font-display);font-weight:700;font-size:16px;display:grid;place-items:center;margin-top:2px}
.fold{background:none;border:0;padding:2px 0;color:var(--accent);font-weight:600;font-size:12px;cursor:pointer}
.part.folded .lines,.part.folded .adds{display:none}
.jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh, 58px) + 4px);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;gap:6px;overflow-x:auto;box-shadow:0 4px 12px rgba(31,26,22,.06)}
.jump button{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:7px;padding:6px 10px;font:inherit;color:var(--fg);cursor:pointer;text-align:left}
.jump button:hover{background:var(--accent-soft)}
.jump .jn{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
.jump .jt{display:grid;line-height:1.2}
.jump .jt span{font-size:12px;color:var(--muted)}
.jump .jt b{font-size:13px}
.part-head .ctype{font-size:11px}
.part-head .amt b{font-size:20px}
.ohrow{background:var(--sunk)}
.totals{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh, 58px) + 8px);display:grid;gap:14px}
@media (max-width:920px){.totals{position:static}}
.tl{display:grid;gap:7px}
.tr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tr input{width:96px}
.tr.big{font-family:var(--font-display);font-size:20px;font-weight:700;border-top:2px solid var(--brand);padding-top:8px}
.tr.key{background:var(--accent-soft);margin:0 -8px;padding:8px;border-radius:6px;font-weight:700;border-left:4px solid var(--brand)}
.result{border-radius:8px;padding:10px 12px;font-weight:600}
.result.pos{background:var(--good-soft)} .result.neg{background:var(--bad-soft)}
.result .big{font-family:var(--font-display);font-size:22px}
.sect{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.formula{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}

/* Rates */
.rates td{vertical-align:middle}
.rates input,.rates select{width:100%}
.rates td.w-name{min-width:220px}
.rates td.w-num{width:96px;min-width:86px}
.defaults{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.defaults input{width:90px}
.cat-row td{background:var(--sunk);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
/* Price history */
.hctl{margin-bottom:14px;align-items:flex-end}
.chartcard{position:relative;margin-bottom:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:8px;font-size:13px}
.lg{display:inline-flex;align-items:center;gap:6px;min-width:0}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax text{fill:var(--muted);font-size:11px}
.gridl{stroke:var(--line);stroke-width:1}
.base{stroke:var(--muted);stroke-width:1}
.endlab{fill:var(--fg);font-size:12px;font-weight:600}
.xhair{stroke:var(--muted);stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);min-width:170px;z-index:2;display:grid;gap:3px}
.hist tr.focus td{background:var(--accent-soft)}
.tip[hidden]{display:none}
.sheetgrp{border:2px solid var(--brand);border-radius:12px;padding:10px;display:grid;gap:10px;background:#FFFAF6}
.sheetgrp.other{border-style:dashed}
.sheetgrp .lines{margin-top:0}
.sghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sgnum{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--accent)}
.sgamt{font-size:13px;color:var(--muted)} .sgamt b{color:var(--fg);font-size:15px}
.line.psheet{border-color:var(--brand)}
.coatpick select{font-weight:600;min-width:200px}
.fields input.bigin{width:150px;font-size:16px;font-weight:600;padding:8px 10px;border-color:var(--brand)}
.pastels{display:grid;gap:6px;background:var(--sunk);border-radius:8px;padding:10px}
.prow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--brand);border-radius:999px;padding:3px 4px 3px 12px}
.pname{font-weight:600}
.pups{display:flex;align-items:center;gap:4px}
.pups input{width:62px;padding:3px 6px}
.pdel{border:0;background:none;color:var(--bad);font-size:18px;line-height:1;padding:0 6px;cursor:pointer}

/* Job cards */
.jcsec{display:grid;gap:10px}
.jcrow{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.jcrow input,.jcrow select{width:100%}
.jcrow .fld{flex:1 1 110px}
.jcrow .fld.w2{flex:2 1 200px}
.jcrow .fld.w0{flex:0 1 80px}
.jcno{font-family:var(--font-display);font-weight:700;color:var(--accent)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer}
.jcprint{display:none}
@media print{
  @page{margin:12mm}
  .bar,#sysmsg,.noprint{display:none!important}
  main{padding:0}
  .jcprint{display:block;font-size:12px;color:#000}
  .jcprint h1{font-size:20px;margin-bottom:2px}
  .jcprint h2{font-size:13px;margin:14px 0 4px;border-bottom:2px solid #EB6123;padding-bottom:2px}
  .jcprint table{width:100%;border-collapse:collapse}
  .jcprint th,.jcprint td{border:1px solid #bbb;padding:4px 6px;white-space:normal;font-size:11px}
  .jcprint th{background:#f4f4f4;color:#000}
  .jcprint tbody tr:last-child td{border-bottom:1px solid #bbb}
  .jcprint .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 16px}
  .jcprint .kv div b{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#555}
  .jcprint .notes{border:1px solid #bbb;padding:6px;min-height:50px;white-space:pre-wrap}
}

/* Team instruction sheets */
.printonly{display:none}
.jump .jctab{font-weight:600;color:var(--muted)}
.jump .jctab[aria-current="page"]{background:var(--brand-strong);color:#fff}
.tsheet{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:8px;padding:18px;display:grid;gap:10px}
.tshead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:10px}
.tsbrand{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.tsheet h1{font-size:24px}
.tsqty{text-align:right;border:2px solid var(--brand);border-radius:8px;padding:6px 14px}
.tsqty span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tsqty b{font-family:var(--font-display);font-size:24px}
.tsheet h3{font-size:15px;margin-top:8px;padding-left:8px;border-left:4px solid var(--brand)}
.tsteam{font-size:18px;margin-top:18px;background:var(--accent-soft);color:var(--accent);padding:8px 12px;border-radius:6px}
.tskv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 18px}
.tskv span{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tskv b{font-weight:600;font-size:15px}
.tsheet td{white-space:normal;font-size:14px}
.tschecks{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.tschecks li{padding-left:28px;position:relative}
.tschecks li::before{content:"";position:absolute;left:2px;top:1px;width:16px;height:16px;border:2px solid var(--fg);border-radius:3px}
.tstext{white-space:pre-wrap;background:var(--warn-soft);color:var(--fg);border-left:4px solid var(--warn);padding:8px 12px;border-radius:4px;font-weight:500}
.tssign{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}
.tssign div{border-top:1px solid var(--fg);padding-top:4px;font-size:12px;color:var(--muted)}
@media print{
  .printonly{display:block}
  .tsheet{border:0;padding:0;break-after:page;font-size:12px}
  .tsheet:last-child{break-after:auto}
  .tsheet .tablebox{border-color:#999;overflow:visible}
  .tsheet th,.tsheet td{border:1px solid #999;font-size:11px;padding:4px 6px}
  .tsheet tbody tr:last-child td{border-bottom:1px solid #999}
  .tsheet h3,.tsteam,table{break-after:avoid}
  .tsheet tr{break-inside:avoid}
}

body:not(.show-rates) .adv{display:none}
.warnline{color:var(--warn);font-weight:500}
@media (max-width:560px){
  .bar .wrap{gap:4px 8px;padding-block:6px}
  .brand{font-size:15px;margin-right:0}
  .brand img{height:30px}
  .bar nav{order:3;width:100%;overflow-x:auto}
  .tab{padding:7px 10px;font-size:14px}
  .spacer{display:none}
  .savestate{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function inferPart(l){
  if (l.part === 'print' && l.calc !== 'piece' && l.calc !== 'lump') return 'print';
  const r = l.rateId && S.rates.get(l.rateId);
  const n = (l.name || '') + ' ' + ((r && r.name) || '');
  if (l.calc === 'sheet') return (n0(l.gsm) >= 800 || /mill|grey|kappa/i.test(n)) ? 'board' : 'print';
  if (l.calc === 'piece' || l.calc === 'lump'){
    if (/making|pasting|labour|stitch|gluing|assembly|cnc/i.test(n)) return 'board';
    if (/magnet|ribbon|hinge|fitting|accessor/i.test(n)) return 'acc';
    if (/insert|tray|foam|eva/i.test(n)) return 'insert';
    if (/pack|carton|forward|transport/i.test(n)) return 'acc';
    return 'board';
  }
  return 'print';
}

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}

const SV = {timers:{}, inflight:{}, pending:{}, errors:0};
function busy(path){ return !!(SV.timers[path] || SV.inflight[path]); }
function setSave(state){
  const el = $('#savestate');
  el.className = 'savestate' + (state === 'error' ? ' err' : '');
  el.textContent = state === 'saving' ? 'Saving…' : state === 'saved' ? 'All changes saved' : state === 'error' ? "Couldn't save. Check your internet and edit again." : '';
}
function scheduleSave(path, getData, delay){
  if (!S.db) return;
  clearTimeout(SV.timers[path]);
  setSave('saving');
  SV.timers[path] = setTimeout(() => { delete SV.timers[path]; flush(path, getData); }, delay ?? 700);
}
async function flush(path, getData){
  if (SV.inflight[path]){ SV.pending[path] = getData; return; }
  SV.inflight[path] = true;
  try { await S.db.doc(path).set(getData()); setSave('saved'); }
  catch(e){ if (e && e.code === 'unavailable'){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ await S.db.doc(path).set(getData()); setSave('saved'); }catch(e2){ setSave('error'); } } else setSave('error'); }
  finally {
    SV.inflight[path] = false;
    const p = SV.pending[path];
    if (p){ delete SV.pending[path]; flush(path, p); }
  }
}
async function removeDoc(path){
  clearTimeout(SV.timers[path]); delete SV.timers[path]; delete SV.pending[path];
  try { await S.db.doc(path).delete(); setSave('saved'); } catch(e){ setSave('error'); }
}

const ratesSorted = () => [...S.rates.values()].sort((a,b) => (CATS.indexOf(a.category) - CATS.indexOf(b.category)) || String(a.name).localeCompare(String(b.name)));
const findRate = (cat, calc, hint) => {
  const list = ratesSorted().filter(r => r.category === cat && r.calc === calc);
  const m = hint ? list.find(r => new RegExp(hint, 'i').test(r.name || '')) : null;
  if (hint === 'corrug') return m || null; // corrugated board only takes a corrugated rate, never mill board
  return m || list[0];
};
const THICK = ['1','1.2','1.4','1.7','1.9','2.4','3'];
// Mill board GSM = thickness (mm) × the board type's GSM-per-mm factor (grey 660, white 680, black 700)
const millFactor = l => { const r = l.rateId && S.rates.get(l.rateId); return r ? n0(r.gsmPerMm) : 0; };
const gsmFor = l => (l.thick && millFactor(l)) ? Math.round(parseFloat(l.thick) * millFactor(l)) : null;
function rateUnit(calc, unit){
  return calc === 'sheet' ? (unit === 'sheet' ? '₹ / sheet' : '₹ / kg') : calc === 'area' ? '₹ / 100 sq in' : calc === 'impression' ? '₹ / 1000 sheets' : calc === 'perup' ? '₹ / up' : calc === 'piece' ? '₹ / pc' : '₹ / job';
}

// ---------- costing engine ----------
// Pastels placed on one printed sheet, e.g. [{name:'Top', ups:2}, {name:'Bottom', ups:2}].
const hasPastels = l => Array.isArray(l.pastels) && l.pastels.length > 0;
// Every box needs one of each pastel, so the pastel with the fewest ups decides the sheet count.
function effUps(src){
  if (hasPastels(src)){ const u = src.pastels.map(p => n0(p.ups)).filter(u => u > 0); return u.length ? Math.min(...u) : 0; }
  return n0(src.ups);
}
const totalUps = src => hasPastels(src) ? src.pastels.reduce((a, p) => a + n0(p.ups), 0) : n0(src.ups);
const pastelText = l => l.pastels.map(p => p.name + ' × ' + fmtN(n0(p.ups))).join(', ');
function sheetsOf(src, qty){
  const ups = effUps(src); if (ups <= 0 || qty <= 0) return 0;
  return Math.ceil(qty / ups * (1 + n0(src.wastage)/100));
}
function calcLine(l, j, byId){
  const qty = n0(j.qty);
  if (l.calc === 'sheet'){
    const sh = sheetsOf(l, qty);
    const kg = n0(l.L) * n0(l.W) * n0(l.gsm) / 1550000;
    const amt = l.unit === 'sheet' ? sh * n0(l.rate) : sh * kg * n0(l.rate);
    const perSheet = l.unit === 'sheet' ? n0(l.rate) : kg * n0(l.rate);
    const eu = effUps(l), base = eu > 0 ? Math.ceil(qty / eu) : 0;
    const upsTxt = hasPastels(l) ? pastelText(l) + ' per sheet → qty ÷ ' + fmtN(eu) : 'qty ÷ ' + fmtN(eu) + ' ups';
    let d = sh ? fmtN(base) + ' sheets (' + upsTxt + ') + ' + fmtN(n0(l.wastage),1) + '% wastage = ' + fmtN(sh) + ' sheets × ₹' + perSheet.toFixed(2) + ' per sheet' : 'Enter quantity and ups to get sheet count';
    if (gsmFor(l)) d += '  ·  GSM = ' + l.thick + ' mm × ' + fmtN(millFactor(l)) + ' = ' + fmtN(gsmFor(l));
    if (sh && l.unit !== 'sheet') d += '  ·  price per sheet = ' + fmtN(n0(l.L),2) + ' × ' + fmtN(n0(l.W),2) + ' × ' + fmtN(n0(l.gsm)) + ' GSM × ₹' + fmtN(n0(l.rate),2) + ' ÷ 15,50,000';
    const qd = sh ? (hasPastels(l) ? pastelText(l) + ' per sheet  ·  ' : '') + fmtN(sh) + ' sheets' + (l.unit !== 'sheet' ? '  ·  ' + fmtN(sh * kg, 1) + ' kg' : '') + (gsmFor(l) ? '  ·  ' + l.thick + ' mm = ' + fmtN(gsmFor(l)) + ' GSM' : '') : d;
    return {amount:amt, sheets:sh, detail:d, qd};
  }
  if (l.calc === 'area' || l.calc === 'impression'){
    const linked = l.link && byId.get(l.link);
    const src = linked && linked.calc === 'sheet' ? linked : l;
    const sh = sheetsOf(src, qty);
    const min = n0(l.minCharge);
    if (l.calc === 'area' && l.coat === 'none') return {amount:0, detail:'No coating on this job', qd:'No coating on this job'};
    if (l.calc === 'area'){
      // Coating covers every printed sheet of the job (one coating type for the whole box).
      const printed = (j.lines || []).filter(x => x.calc === 'sheet' && partOf(x) === 'print');
      const parts = (printed.length ? printed : [src]).map((x, i) => ({n: printed.length ? 'Sheet ' + (i + 1) : 'Sheet', sh: sheetsOf(x, qty), L: n0(x.L), W: n0(x.W)}))
        .filter(p => p.sh > 0);
      const totSh = parts.reduce((t, p) => t + p.sh, 0);
      const sumArea = parts.reduce((t, p) => t + p.L * p.W * p.sh, 0);
      if (!totSh) return {amount:0, detail:'No printed sheets yet', qd:'No printed sheets yet'};
      const list = parts.map(p => p.n + ': ' + fmtN(p.sh) + ' × ' + fmtN(Math.min(p.L, p.W), 2) + '×' + fmtN(Math.max(p.L, p.W), 2) + ' in').join(', ');
      const qdBase = (parts.length > 1 ? 'All ' + parts.length + ' printed sheets (' + fmtN(totSh) + ' sheets)' : fmtN(totSh) + ' sheets of ' + fmtN(Math.min(parts[0].L, parts[0].W), 2) + ' × ' + fmtN(Math.max(parts[0].L, parts[0].W), 2) + ' in');
      // Varnish / hybrid: L × W ÷ divisor gives paisa per sheet; ÷ 100 = ₹ per sheet; × sheets. No labour added.
      if (n0(l.paisaDiv) > 0){
        const amt = sumArea / n0(l.paisaDiv) / 100;
        const per = parts.map(p => p.n + ': ' + fmtN(p.L * p.W / n0(l.paisaDiv), 2) + ' paisa × ' + fmtN(p.sh)).join(', ');
        return {amount:amt, detail:'L × W ÷ ' + fmtN(n0(l.paisaDiv), 2) + ' = paisa per sheet  ·  ' + per, qd: qdBase + '  ·  ₹' + fmtN(amt / totSh, 2) + ' per sheet avg'};
      }
      // Lamination from the roll price: L × W × sheets ÷ 1,552, ÷ the type's divisor = kg of roll, × ₹ per kg, + labour %.
      if (l.rollRate != null && n0(l.perKg) > 0){
        const base = sumArea / 1552, kgRoll = base / n0(l.perKg), mat = kgRoll * n0(l.rollRate);
        const labPct = l.labourPct ?? (S.settings.lamLabourPct ?? 100), amt = mat * (1 + n0(labPct) / 100);
        return {amount:amt,
          detail: list + '  ·  ÷ 1,552 = ' + fmtN(base, 1) + '  ·  ÷ ' + fmtN(n0(l.perKg)) + ' = ' + fmtN(kgRoll, 2) + ' kg roll × ₹' + fmtN(n0(l.rollRate)) + ' / kg = ₹' + fmtN(mat) + ' material + ' + fmtN(n0(labPct)) + '% labour',
          qd: qdBase + '  ·  ' + fmtN(kgRoll, 2) + ' kg roll  ·  material + labour'};
      }
      const run = sumArea / 100 * n0(l.rate);
      const amt = run > 0 ? Math.max(run, min) : 0;
      let d = list;
      if (run > 0 && run < min) d += ' · minimum charge applied';
      return {amount:amt, detail:d, qd:qdBase};
    }
    const passes = n0(l.passes);
    const run = sh / 1000 * n0(l.rate);
    const perPass = sh > 0 ? Math.max(run, min) : 0;
    const amt = passes * (n0(l.setup) + perPass);
    let d = sh ? fmtN(sh) + ' sheets × ' + passes + (passes === 1 ? ' pass' : ' passes') : 'No sheets yet';
    if (sh > 0 && run < min && passes) d += ' · minimum charge applied';
    const qd = sh ? fmtN(sh) + ' sheets × ' + passes + (passes === 1 ? ' pass' : ' passes') : 'No sheets yet';
    if (n0(l.setup) && passes) d += ' · setup ₹' + fmtN(n0(l.setup)) + ' per pass';
    return {amount:amt, detail:d, qd};
  }
  if (l.calc === 'perup'){
    const linked = l.link && byId.get(l.link);
    const src = linked && linked.calc === 'sheet' ? linked : l;
    const sh = sheetsOf(src, qty), per = totalUps(src) || 1, n = sh * per, passes = n0(l.passes);
    if (!n) return {amount:0, detail:'No sheets yet'};
    const raw = n0(l.setup) + n * n0(l.rate), min = n0(l.minCharge);
    const each = Math.max(raw, min), amt = passes * each;
    let d = fmtN(n) + ' ups (' + fmtN(sh) + ' sheets × ' + per + ' ups) × ₹' + fmtN(n0(l.rate), 2) + ' + block ₹' + fmtN(n0(l.setup)) + ' = ₹' + fmtN(raw);
    if (raw < min) d += '  ·  minimum ₹' + fmtN(min) + ' applied';
    if (passes !== 1) d += '  ·  × ' + passes + ' blocks';
    const qd = fmtN(n) + ' ups (' + fmtN(sh) + ' sheets × ' + per + ' ups)' + (passes !== 1 ? '  ·  × ' + passes + ' blocks' : '') + (raw < min ? '  ·  minimum charge applied' : '');
    return {amount:amt, detail:d, qd};
  }
  if (l.calc === 'diecut' && partOf(l) === 'die'){
    // Dies × rate per die, plus die cutting on the TOTAL of all printed sheets: first 1000, then each further 1000 (a part 1000 counts as full).
    const dies = n0(l.dies), dieCost = dies * n0(l.setup);
    const printed = (j.lines || []).filter(x => x.calc === 'sheet' && partOf(x) === 'print');
    const counts = printed.map(x => sheetsOf(x, qty));
    const tot = counts.reduce((t, n) => t + n, 0), k = Math.ceil(tot / 1000);
    const cut = tot ? n0(l.first) + (k - 1) * n0(l.next) : 0;
    const dieTxt = dies + (dies === 1 ? ' die' : ' dies') + ' × ₹' + fmtN(n0(l.setup)) + ' = ₹' + fmtN(dieCost);
    const totTxt = (counts.filter(n => n > 0).length > 1 ? counts.filter(n => n > 0).map(n => fmtN(n)).join(' + ') + ' = ' : '') + fmtN(tot) + ' printed sheets';
    return {amount: dieCost + cut,
      detail: dieTxt + '  ·  cutting: ' + (tot ? totTxt + ' = ' + k + ' × 1000 → ₹' + fmtN(n0(l.first)) + ' first 1000' + (k > 1 ? ' + ' + (k - 1) + ' × ₹' + fmtN(n0(l.next)) : '') + ' = ₹' + fmtN(cut) : 'no printed sheets yet'),
      qd: dies + (dies === 1 ? ' die' : ' dies') + '  ·  cutting ' + (tot ? totTxt : '—')};
  }
  if (l.calc === 'diecut'){
    const linked = l.link && byId.get(l.link);
    const src = linked && linked.calc === 'sheet' ? linked : l;
    const sh = sheetsOf(src, qty), k = Math.ceil(sh / 1000), dies = n0(l.dies);
    const dieCost = dies * n0(l.setup), run = sh ? n0(l.first) + (k - 1) * n0(l.next) : 0;
    let d = dies + (dies === 1 ? ' die' : ' dies') + ' × ₹' + fmtN(n0(l.setup)) + ' = ₹' + fmtN(dieCost);
    d += sh ? '  ·  ' + fmtN(sh) + ' sheets = ' + k + ' × 1000  ·  ₹' + fmtN(n0(l.first)) + ' first 1000' + (k > 1 ? ' + ' + (k - 1) + ' × ₹' + fmtN(n0(l.next)) : '') : '  ·  no sheets yet';
    return {amount: dieCost + run, detail:d, qd: dies + (dies === 1 ? ' die' : ' dies') + '  ·  ' + (sh ? fmtN(sh) + ' sheets' : 'no sheets yet')};
  }
  if (l.calc === 'printing'){
    const linked = l.link && byId.get(l.link);
    const src = linked && linked.calc === 'sheet' ? linked : l;
    const sh = sheetsOf(src, qty), c = n0(l.colours);
    if (!c) return {amount:0, detail:'Choose the number of colours'};
    if (!sh) return {amount:0, detail:'No sheets yet'};
    if (l.first == null) return {amount:0, detail:'No printing rate saved for ' + c + ' colour' + (c > 1 ? 's' : '') + '. Type it here, or add it in Rate list → Printing rates.'};
    const k = Math.ceil(sh / 1000);
    const plates = c * n0(l.plate), run = n0(l.first) + (k - 1) * n0(l.next);
    let amt = plates + run;
    let d = c + ' plate' + (c > 1 ? 's' : '') + ' × ₹' + fmtN(n0(l.plate)) + ' = ₹' + fmtN(plates) + '  ·  ' + fmtN(sh) + ' sheets = ' + k + ' × 1000  ·  ₹' + fmtN(n0(l.first)) + ' first 1000' + (k > 1 ? ' + ' + (k - 1) + ' × ₹' + fmtN(n0(l.next)) : '');
    if (k > 1 && l.next == null) d += '  ·  rate for each further 1000 not set';
    let qd = c + (c === 1 ? ' colour' : ' colours') + '  ·  ' + fmtN(sh) + ' sheets';
    if (n0(l.minCharge) && amt < n0(l.minCharge)){ amt = n0(l.minCharge); d += '  ·  minimum ₹' + fmtN(amt) + ' applied'; qd += '  ·  minimum charge applied'; }
    return {amount:amt, detail:d, qd};

    if (l.total != null) return {amount: n0(l.total) * n0(l.rate), detail: fmtN(n0(l.total), 2) + ' total for the job × ₹' + fmtN(n0(l.rate), 2), qd: fmtN(n0(l.total), 2) + ' total for the job'};
    // Magnets follow the job card rule unless typed by hand: 2 if box width W > 170 mm, else 1.
    const autoMag = l.auto === 'magnets' && l.perBox == null;
    const per = autoMag ? (n0(j.w) > 170 ? 2 : 1) : l.perBox == null ? 1 : n0(l.perBox);
    const n = Math.ceil(qty * per * (1 + n0(l.wastage)/100));
    const magNote = autoMag ? (n0(j.w) ? '  ·  ' + per + ' per box auto (W ' + (n0(j.w) > 170 ? '> ' : '≤ ') + '170 mm)' : '  ·  enter box width W to set magnets automatically') : '';
    return {amount: n * n0(l.rate), magNote, qd: (per !== 1 ? fmtN(qty) + ' boxes × ' + fmtN(per, 2) + ' per box = ' : '') + fmtN(n) + ' pcs', detail: (per !== 1 ? fmtN(qty) + ' boxes × ' + fmtN(per, 2) + ' per box = ' : '') + fmtN(n) + ' pcs' + (n0(l.wastage) ? ' (incl. ' + fmtN(n0(l.wastage), 1) + '% wastage)' : '') + ' × ₹' + fmtN(n0(l.rate),2)};

}
function computeJob(j){
  const lines = j.lines || [];
  const byId = new Map(lines.map(l => [l.id, l]));
  const res = new Map();
  let sub = 0, actSub = 0, actualCount = 0;
  const partSub = Object.fromEntries(PART_KEYS.map(k => [k, 0]));
  const shown = partsFor(j);
  for (const l of lines){
    if (!shown.includes(partOf(l))) continue; // lines in calculators this product doesn't use are not counted
    const r = calcLine(l, j, byId); res.set(l.id, r); sub += r.amount; partSub[partOf(l)] += r.amount;
    if (l.actual != null){ actSub += l.actual; actualCount++; } else actSub += r.amount;
  }
  const oh = n0(j.overheadPct) / 100, qty = n0(j.qty);
  const total = sub * (1 + oh);
  const perPc = qty ? total / qty : 0;
  const suggested = perPc * (1 + n0(j.marginPct) / 100);
  const quoteValue = j.quotePrice != null ? j.quotePrice * qty : null;
  const quoteProfit = quoteValue != null ? quoteValue - total : null;
  const actualTotal = actSub * (1 + oh);
  const soldQty = qty; // the ordered quantity is always what is dispatched
  const price = j.soldPrice ?? j.quotePrice ?? null;
  const sales = price != null ? price * soldQty : null;
  const profit = sales != null ? sales - actualTotal : null;
  return {res, sub, partSub, qty, overhead: sub*oh, total, perPc, suggested, quoteValue, quoteProfit,
    actualTotal, actualPerPc: qty ? actualTotal/qty : 0, actualCount, lineCount: lines.length, soldQty, sales, profit};
}
// What a job counts as in reports: actual figures once completed, otherwise the estimate.
function jobFigures(j){
  const c = computeJob(j), done = false; // no status any more: always estimate cost vs quoted price
  const costPc = done ? c.actualPerPc : c.perPc;
  const pricePc = done ? (j.soldPrice ?? j.quotePrice) : (j.quotePrice ?? null);
  const cost = done ? c.actualTotal : c.total;
  const value = done ? (pricePc != null ? pricePc * c.soldQty : null) : (pricePc != null ? pricePc * n0(j.qty) : null);
  const profit = value != null ? value - cost : null;
  return {c, costPc, pricePc, cost, value, profit, onCost: profit != null && cost ? profit / cost * 100 : null};
}

// ---------- lines ----------
function makeLine(calc, o){
  o = o || {};
  const w = S.settings.wastagePct ?? 5;
  const l = {id:uid(), name:o.name || '', calc, rateId:null, rate:null, unit:'kg',
    L:o.L ?? null, W:o.W ?? null, gsm:o.gsm ?? null, perBox:o.perBox ?? null, auto:o.auto ?? null,
    pastels: o.pastels ? o.pastels.map(x => ({...x})) : null, finish: o.finish || null, insert: o.insert || null, jobRate: o.jobRate || null, making: o.making || null, fx: o.fx || null, accKind: o.accKind || null, acc: o.accKind ? {} : null,
    ups: o.ups ?? (calc === 'piece' || calc === 'lump' ? null : 1),
    wastage: calc === 'piece' || calc === 'lump' ? 0 : w,
    link:null, passes: o.passes ?? (calc === 'impression' || calc === 'perup' ? 1 : null), setup:null, minCharge:null, actual:null};
  const r = o.rateObj || (o.cat ? findRate(o.cat, calc, o.hint) : null);
  if (r) applyRate(l, r, !o.name);
  if (o.thick){ l.thick = o.thick; l.gsm = gsmFor(l) || l.gsm; }
  if (calc === 'printing'){ l.colours = o.colours ?? 4; snapPrint(l); }
  if (calc === 'diecut'){ l.dies = 'dies' in o ? o.dies : 1; snapDie(l); }
  if (calc === 'area') l.coat = o.coat || null;
  l.part = o.part || inferPart(l); l.pv = 2;

}
// Copies the colour-wise printing rate into the line, so later rate changes don't alter old costings.
const printTable = () => S.settings.printing || S.printDefaults;
const dieTable = () => ({...S.diecutDefaults, ...(S.settings.diecut || {})});
function snapDie(l){ const D = dieTable(); l.setup = D.die ?? null; l.first = D.first ?? null; l.next = D.next ?? null; }
function snapPrint(l){
  const P = printTable(), row = (P.rows || {})[String(n0(l.colours))] || {};
  l.plate = P.plate ?? null; l.first = row.first ?? null; l.next = row.next ?? null; l.minCharge = row.min ?? null;
}
function applyRate(l, r, setName){
  l.rateId = r.id; l.rate = r.rate ?? null;
  if (l.calc === 'sheet'){ l.unit = r.unit || 'kg'; if (gsmFor(l)) l.gsm = gsmFor(l); else if (r.gsm) l.gsm = r.gsm; }
  if (l.calc === 'area' || l.calc === 'impression' || l.calc === 'perup') l.minCharge = r.minCharge ?? null;
  if (l.calc === 'impression' || l.calc === 'perup') l.setup = r.setup ?? null;
  if (l.calc === 'area'){ l.rollRate = r.rollRate ?? null; l.perKg = r.sqmPerKg ?? null; l.labourPct = S.settings.lamLabourPct ?? 100; l.paisaDiv = r.paisaDiv ?? null; }
  if (setName || !l.name) l.name = r.name;
}
function linesFromTemplate(box){
  const keys = {}, out = [];
  for (const t of TEMPLATES[box] || []){
    const isPrint = t.calc === 'impression' && t.cat === 'Printing';
    const calc = t.calc === 'impression' && !findRate(t.cat, 'impression') && findRate(t.cat, 'perup') ? 'perup' : t.calc;
    const l = isPrint ? makeLine('printing', {name:t.name, colours:t.passes, part:'print'})
      : t.cat === 'Die cutting' ? makeLine('diecut', {name:t.name, part:'print'}) : makeLine(calc, t);
    if (t.k) keys[t.k] = l.id;

function nextJobNo(prefix){
  let max = 0; const re = new RegExp('^' + prefix + '[-/ ]?(\\d+)$', 'i');
  for (const j of S.jobs.values()){ const m = re.exec(j.jobNo || ''); if (m) max = Math.max(max, +m[1]); }
  return prefix + '-' + String(max + 1).padStart(3, '0');
}

// How far a past size is from the one searched (mm). Length and width may be swapped; height must match height.
function sizeGap(e, q){
  const has = v => v != null && v !== '' && !isNaN(v);
  const d = (a, b) => has(a) && has(b) ? Math.abs(n0(a) - n0(b)) : null;
  const opts = [[d(e.l, q.l), d(e.w, q.w)], [d(e.l, q.w), d(e.w, q.l)]].map(p => p.concat([d(e.h, q.h)]));
  let best = null;
  for (const o of opts){
    const asked = [q.l, q.w, q.h].filter(has).length; if (!asked) return null;
    const vals = o.filter(v => v != null);
    if (vals.length < asked) continue; // the past entry is missing a size that was searched
    const m = Math.max(...vals);

  const words = ['Box','Kite','Lamp','Ink','Foil','Sheet','Board','Gold','Mint','Leaf','Star','Wave','Rose','Sky','Pine','Moon'];
  const r = new Uint32Array(3); crypto.getRandomValues(r);

}

function addLine(calc, part, label, extra, linkTo){

    o = {part, name:'Corrugated board sheet', gsm:550, ups:1, rateObj:findRate('Board', 'sheet', 'corrug')};
  } else if (calc === 'sheet' && part === 'board'){
    const r = findRate('Board', 'sheet', 'grey') ;
    const mill = r && /mill|grey/i.test(r.name || '') ? r : ratesSorted().find(x => x.calc === 'sheet' && /mill/i.test(x.name || ''));
    o = {part, name:'Kappa board', gsm:1200, ups:1, thick:'1.9', rateObj:mill};

    const anyPlaced = Object.keys(counts).length > 0;

    const msgs = [];

  if (mw) mw.textContent = moq && n0(j.qty) && n0(j.qty) < moq ? 'Quantity is below the minimum order of ' + fmtN(moq) + ' pcs for ' + (BOX[j.boxType] || 'this product') + '.' : '';
  set('quoteValue', rs(c.quoteValue));
  set('quoteProfit', c.quoteProfit == null ? '—' : rs(c.quoteProfit) + (c.total ? '  (' + pct(c.quoteProfit / c.total * 100) + ')' : ''), c.quoteProfit == null ? '' : c.quoteProfit >= 0 ? 'pos' : 'neg');
  set('sales', rs(c.sales)); set('actualTotal', rs(c.actualTotal)); set('actualPerPc', rs2(c.actualPerPc));
  set('actualNote', c.lineCount ? (c.actualCount === c.lineCount ? 'Actual entered for every line.' : 'Actual entered for ' + c.actualCount + ' of ' + c.lineCount + ' lines; the rest use the estimate.') : '');
  const res = document.querySelector('[data-t="result"]');
  if (res){
    res.replaceChildren();
    if (c.profit == null){ res.className = 'result'; res.append(h('span',{class:'note'},'Enter the sold price to see the real profit on this job.')); }

        h('div',{class:'big ' + (c.profit >= 0 ? 'pos' : 'neg')}, rs(c.profit)),

    }
  }
}

// Job card numbers follow the Firstbox Works series: CO = complete order, JW = job work.
// CO starts at 102 because CO-101 already exists in Firstbox Works.
const SERIES = {CO:'Complete order', JW:'Job work'};
const JC_START = {CO:102, JW:101};
function nextCardNum(series){
  let max = (JC_START[series] || 101) - 1;
  for (const c of S.cards.values()) if (c.series === series) max = Math.max(max, n0(c.num));
  return max + 1;
}
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '';
// Turns a costing into job card details: what to make, not what it costs.
function specFromCosting(j){
  const qty = n0(j.qty), rname = l => { const r = l.rateId && S.rates.get(l.rateId); return r ? r.name : ''; };
  const parts = partsFor(j), inPart = (l, p) => parts.includes(p) && partOf(l) === p;
  const sheetsL = j.lines.filter(l => l.calc === 'sheet' && inPart(l, 'print'));
  const sheetName = id => { const s = sheetsL.find(x => x.id === id); return s ? (s.name || 'Printed sheet ' + (sheetsL.indexOf(s) + 1)) : ''; };
  const sheets = sheetsL.map((l, i) => {
    const pr = j.lines.find(x => x.calc === 'printing' && x.link === l.id);
    return {name: l.name || 'Printed sheet ' + (i + 1), paper: rname(l), gsm: l.gsm ?? null, L: l.L ?? null, W: l.W ?? null,
      ups: hasPastels(l) ? pastelText(l) : (l.ups != null ? String(l.ups) + ' ups' : ''), colours: pr ? (pr.colours ?? null) : null, pantone:'', count: sheetsOf(l, qty) || null};
  });
  const coatL = j.lines.find(l => l.calc === 'area' && inPart(l, 'finish'));
  const coat = !coatL || !coatL.coat ? '' : coatL.coat === 'none' ? 'None' : (rname(coatL) || COATS[coatL.coat]);
  const fx = j.lines.filter(l => l.fx && l.fxKind && inPart(l, 'finish')).map(l => ({kind: l.fxKind, sheet: l.link ? sheetName(l.link) : '', part: l.fxPart || '',
    blocks: l.fxKind === 'spotuv' ? null : (l.passes ?? null), colour: l.fxKind === 'foil' ? (l.foilColour || '') : l.fxKind === 'spotuv' ? rname(l).replace(/^spot uv\s*[–-]\s*/i, '') : ''}));
  const boards = j.lines.filter(l => l.calc === 'sheet' && inPart(l, 'board')).map(l => ({type: rname(l) || l.name || '', thick: l.thick || '', L: l.L ?? null, W: l.W ?? null, ups: l.ups ?? null, count: sheetsOf(l, qty) || null}));
  const inserts = j.lines.filter(l => l.insert && l.insType && inPart(l, 'insert')).map(l => ({type: l.insType || '', material: l.foamMat || '', thick: l.foamThick ?? null, colour: l.insColour || '', cover: l.cover && l.cover !== 'none' ? l.cover : '', coverColour: l.coverColour || ''}));
  const acc = j.lines.filter(l => inPart(l, 'acc')).map(l => {
    const a = l.acc || {};
    const per = l.auto === 'magnets' && l.perBox == null ? (n0(j.w) > 170 ? 2 : 1) : (l.perBox ?? null);
    const det = l.accKind === 'card' ? [a.method ? (a.method === 'digital' ? 'Digital' : 'Offset') : '', a.desc] : [a.size, a.type, a.printing, a.desc];
    return {name: l.name || 'Accessory', perBox: per, details: det.filter(Boolean).join(' · ')};
  });
  const dieL = j.lines.find(l => l.calc === 'diecut' && inPart(l, 'die'));
  return {client: j.client || '', description: j.description || '', boxType: j.boxType, qty: j.qty ?? null, l: j.l ?? null, w: j.w ?? null, h: j.h ?? null,
    making: RIGID.has(j.boxType) ? (j.making || '') : '', sheets, coat, fx, boards, inserts, acc, dies: dieL ? (dieL.dies ?? null) : null};
}

// Details a team would need but nobody has filled in yet.
function missingFor(c){

  if (RIGID.has(c.boxType) && !c.making) m.push('Box making (grooving or half cut)');
  if (P.includes('print') && !c.sheets.length) m.push('Printed sheets');
  c.sheets.forEach(s => { const miss = [!s.paper && 'paper', !s.gsm && 'GSM', !(s.L && s.W) && 'sheet size', !s.ups && 'ups', !s.count && 'sheets to print'].filter(Boolean); if (miss.length) m.push(s.name + ': ' + miss.join(', ')); });

const LOGO = () => (document.getElementById('logo') || {}).src || '';

let pdfLibP = null;
function loadPdfLib(){
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  if (pdfLibP) return pdfLibP;
  const tryUrl = url => new Promise((res, rej) => { const s = document.createElement('script'); s.src = url; s.onload = () => window.PDFLib ? res(window.PDFLib) : rej(new Error('no lib')); s.onerror = () => { s.remove(); rej(new Error('load failed')); }; document.head.append(s); });
  pdfLibP = tryUrl('https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js')
    .catch(() => tryUrl('https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js'))
    .catch(e => { pdfLibP = null; throw e; });
  return pdfLibP;
}

// ---------- Stock & inventory ----------
// Items live in `stock/<id>`; every stock in / out is a row in `stockLog/<id>`. On-hand qty is kept on the item.
const SCATS = {
  paper:{n:'Paper & card', unit:'sheets', fields:['name','gsm','size'], ph:'e.g. Art paper'},
  board:{n:'Mill / kappa board', unit:'sheets', fields:['name','thick','size'], ph:'e.g. Grey back'},
  lam:{n:'Lamination rolls', unit:'kg', fields:['name','width'], ph:'e.g. Thermal matte'},
  foil:{n:'Foil', unit:'rolls', fields:['name','width'], ph:'e.g. Gold'},
  acc:{n:'Accessories', unit:'pcs', fields:['name','spec'], ph:'e.g. Magnet, Ribbon'},
  insert:{n:'Insert material', unit:'sheets', fields:['name','thick','spec'], ph:'e.g. EVA foam black'},
  other:{n:'Other', unit:'pcs', fields:['name','spec'], ph:'e.g. Glue, Packing cartons'}
};
const normS = s => String(s || '').toLowerCase().replace(/[^a-z0-9.]/g, '');
const sameSize = (a, b) => !n0(a.L) || !n0(a.W) || !n0(b.L) || !n0(b.W) || (n0(a.L) === n0(b.L) && n0(a.W) === n0(b.W)) || (n0(a.L) === n0(b.W) && n0(a.W) === n0(b.L));
function stockLabel(it){
  if (!it) return 'Unknown item';
  return [it.name || SCATS[it.cat]?.n || 'Item', it.gsm ? it.gsm + ' GSM' : '', it.thick ? it.thick + ' mm' : '', n0(it.L) && n0(it.W) ? it.L + ' × ' + it.W + ' in' : '', it.width ? it.width + ' in wide' : '', it.spec || ''].filter(Boolean).join(' · ');
}
const stockSorted = () => [...S.stock.values()].sort((a, b) => Object.keys(SCATS).indexOf(a.cat) - Object.keys(SCATS).indexOf(b.cat) || stockLabel(a).localeCompare(stockLabel(b)));
function stockSel(value, attrs){
  const s = h('select', attrs, h('option',{value:''},'Not in stock list'),
    Object.entries(SCATS).map(([k, C]) => { const its = stockSorted().filter(i => i.cat === k); return its.length ? h('optgroup',{label:C.n}, its.map(i => h('option',{value:i.id}, stockLabel(i)))) : null; }));
  s.value = value && S.stock.has(value) ? value : ''; return s;
}
function saveStockItem(it){ it.updatedAt = Date.now(); S.stock.set(it.id, clone(it)); const snap = clone(it); flush('stock/' + it.id, () => snap); }
// Records one movement and changes the on-hand quantity. delta is + for stock in, − for stock out.
function moveStock(itemId, delta, o){
  const it = S.stock.get(itemId); if (!it || !delta) return null;
  const cur = clone(it); cur.qty = Math.round((n0(cur.qty) + delta) * 1000) / 1000; saveStockItem(cur);
  const row = {id: uid(), itemId, qty: delta, type: o.type, date: o.date || today(), note: o.note || '', jobCard: o.jobCard || '', at: Date.now(), after: cur.qty};
  S.slog.set(row.id, row); flush('stockLog/' + row.id, () => clone(row));
  return row;
}
// What a job card needs from stock, matched to stock items where possible.
// Paper and board by printed / board sheets; magnets, ribbon and other accessories per box × qty;
// lamination roll in kg (sheet area ÷ 1552 ÷ the roll's divisor); foil by colour (quantity typed on the job card).
function cardNeeds(c){
  const out = [], qty = n0(c.qty), its = [...S.stock.values()];
  const find = (cat, test) => its.filter(i => i.cat === cat && test(i));
  const words = s => String(s || '').toLowerCase().split(/[^a-z0-9.]+/).filter(w => w && !['lamination','roll','normal','foil','–','-'].includes(w));
  (c.sheets || []).forEach(s => { if (!n0(s.count)) return;
    const m = find('paper', i => (normS(i.name) === normS(s.paper) || (normS(s.paper) && normS(i.name).includes(normS(s.paper)))) && (!i.gsm || !s.gsm || n0(i.gsm) === n0(s.gsm)) && sameSize(i, s))[0];
    out.push({key:'s:' + s.name, kind:'Paper', label:[s.name, s.paper, s.gsm ? s.gsm + ' GSM' : '', s.L && s.W ? s.L + ' × ' + s.W + ' in' : ''].filter(Boolean).join(' · '), itemId: m ? m.id : '', qty: n0(s.count), unit:'sheets'}); });
  if (partsFor(c).includes('board')) (c.boards || []).forEach((b, k) => { if (!n0(b.count)) return;
    const col = (String(b.type).match(/grey|gray|white|black/i) || [''])[0].toLowerCase().replace('gray', 'grey');
    const m = find('board', i => (col ? normS(i.name).includes(col) : true) && (!i.thick || !b.thick || parseFloat(i.thick) === parseFloat(b.thick)) && sameSize(i, b))[0];
    out.push({key:'b:' + k, kind:'Board', label:['Kappa board', b.type, b.thick ? b.thick + ' mm' : '', b.L && b.W ? b.L + ' × ' + b.W + ' in' : ''].filter(Boolean).join(' · '), itemId: m ? m.id : '', qty: n0(b.count), unit:'sheets'}); });
  if (partsFor(c).includes('finish') && /lamination/i.test(c.coat || '')){
    const r = ratesSorted().find(x => x.category === 'Lamination' && normS(x.name) === normS(c.coat));
    const div = r ? n0(r.sqmPerKg) : n0((S.shared.lam || {})[normS(c.coat)]), area = (c.sheets || []).reduce((a, s) => a + n0(s.L) * n0(s.W) * n0(s.count), 0);
    const kg = div && area ? Math.ceil(area / 1552 / div * 10) / 10 : null;
    const cw = words(c.coat), minSide = Math.min(...(c.sheets || []).map(s => Math.min(n0(s.L) || 99, n0(s.W) || 99)));
    const cands = find('lam', i => words(i.name).length && words(i.name).every(w => cw.includes(w)));
    const m = cands.filter(i => !n0(i.width) || n0(i.width) >= minSide).sort((a, b) => n0(a.width) - n0(b.width))[0] || cands[0];
    out.push({key:'lam', kind:'Lamination', label:'Lamination roll · ' + String(c.coat).replace(/^lamination\s*[–-]\s*/i, '') + (minSide < 99 ? ' · at least ' + minSide + ' in wide' : ''), itemId: m ? m.id : '', qty: kg, unit:'kg'});
  }
  if (partsFor(c).includes('finish')) (c.fx || []).forEach((f, k) => { if (f.kind !== 'foil') return;
    const col = normS(f.colour);
    const m = col ? find('foil', i => normS(i.name).includes(col) || col.includes(normS(i.name)))[0] : null;
    out.push({key:'f:' + k, kind:'Foil', label:'Foil · ' + (f.colour || 'colour not set') + [f.sheet ? ' · ' + f.sheet : '', f.part ? ' · ' + f.part : ''].join(''), itemId: m ? m.id : '', qty: null, unit: m ? m.unit : 'rolls'}); });
  if (partsFor(c).includes('acc')) (c.acc || []).forEach((a, k) => { if (!a.name || a.perBox == null || a.perBox === '' || !qty) return;
    const w = normS(a.name).replace(/s$/, '');
    const m = find('acc', i => normS(i.name).includes(w) || w.includes(normS(i.name).replace(/s$/, '')))[0];
    out.push({key:'a:' + k, kind:'Accessory', label: a.name + ' (' + a.perBox + ' per box × ' + fmtN(qty) + ')', itemId: m ? m.id : '', qty: n0(a.perBox) * qty, unit: m ? m.unit : 'pcs'}); });
  return out;
}
// The job card's lines after your own changes on its Materials & stock tab (other stock item, other qty, extra lines).
function cardLines(c){
  const pick = c.stockPick || {}, q = c.stockQty || {};
  const lines = cardNeeds(c).map(n => ({...n, auto:true, itemId: n.key in pick ? pick[n.key] : n.itemId, qty: q[n.key] != null ? q[n.key] : n.qty, calcQty: n.qty}));
  (c.stockExtra || []).forEach((x, i) => lines.push({key:'x:' + i, kind:'Other', label: x.label || 'Other material', itemId: x.itemId || '', qty: x.qty ?? null, unit: (S.stock.get(x.itemId) || {}).unit || '', extra:true, idx:i}));
  return lines;
}
// Stock taken by a job card: {itemId: qty}. Older cards kept a list called `issued`.
function reservedOf(c){
  if (c.reserved && typeof c.reserved === 'object') return {...c.reserved};
  const r = {}; (c.issued || []).forEach(x => { r[x.itemId] = (r[x.itemId] || 0) + n0(x.qty); }); return r;
}
// Takes out (or puts back) only the difference between what the job card needs now and what it already took.
function syncCardStock(c, why){
  if (S.role === 'inventory') return false; // inventory can’t change job cards; the next job-card or owner session catches up
  if (!S.db || !S.loaded.stock || !S.loaded.cards || !c || !S.cards.has(c.id)) return false;
  const want = {};
  for (const l of cardLines(c)) if (l.itemId && S.stock.has(l.itemId) && n0(l.qty) > 0) want[l.itemId] = Math.round(((want[l.itemId] || 0) + n0(l.qty)) * 1000) / 1000;
  const have = reservedOf(c);
  let changed = 'issued' in c;
  for (const id of new Set([...Object.keys(want), ...Object.keys(have)])){
    const d = Math.round(((want[id] || 0) - (have[id] || 0)) * 1000) / 1000;
    if (!S.stock.has(id)){ if (have[id] != null){ delete have[id]; changed = true; } continue; }
    if (!d) continue;
    moveStock(id, -d, {type: d > 0 ? 'out' : 'ret', jobCard: c.id, note: why || 'Job card changed'});
    if (want[id]) have[id] = want[id]; else delete have[id];
    changed = true;
  }
  if (changed){
    c.reserved = have; delete c.issued; saveCard(c);
    if (S.cdraft && S.cdraft.id === c.id && S.cdraft !== c){ S.cdraft.reserved = clone(have); delete S.cdraft.issued; }
  }
  return changed;
}
function syncAllCards(why){
  if (!S.loaded.stock || !S.loaded.cards) return;
  for (const id of [...S.cards.keys()]){ const c = S.cdraft && S.cdraft.id === id ? S.cdraft : clone(S.cards.get(id)); syncCardStock(c, why || 'Stock list changed'); }
}
function releaseCardStock(c){
  const have = reservedOf(c);
  for (const [id, q] of Object.entries(have)) if (S.stock.has(id) && n0(q)) moveStock(id, n0(q), {type:'ret', jobCard: c.id, note:'Job card deleted'});
}
let stockSyncT = null;
function scheduleCardSync(){ clearTimeout(stockSyncT); stockSyncT = setTimeout(() => { if (S.cdraft) syncCardStock(S.cdraft, 'Job card changed'); }, 2500); }
const reservedByItem = () => { const m = {}; for (const c of S.cards.values()) for (const [id, q] of Object.entries(reservedOf(c))){ m[id] = m[id] || {qty:0, cards:[]}; m[id].qty += n0(q); m[id].cards.push(c.id); } return m; };

// Procurement: what to buy, and each upcoming job card's material status.
function procurement(){
  const buy = [], jobs = [];
  for (const it of stockSorted()){
    const q = n0(it.qty), ro = n0(it.reorder);
    if (q < 0) buy.push({label: stockLabel(it), itemId: it.id, qty: -q + ro, unit: it.unit, why: 'Short ' + fmtN(-q, 2) + ' ' + it.unit + ' for job cards' + (ro ? ', plus ' + fmtN(ro) + ' to get back to the reorder level' : ''), level:'bad'});
    else if (ro && q <= ro) buy.push({label: stockLabel(it), itemId: it.id, qty: ro * 2 - q, unit: it.unit, why: 'Down to ' + fmtN(q, 2) + ' ' + it.unit + ' (reorder at ' + fmtN(ro) + ')', level:'warn', soft:true});
  }
  const cards = [...S.cards.values()].sort((a, b) => String(a.due || '9999').localeCompare(String(b.due || '9999')) || String(a.id).localeCompare(String(b.id)));
  for (const c of cards){
    const res = reservedOf(c), rows = [];
    for (const l of cardLines(c)){
      const it = l.itemId && S.stock.get(l.itemId);
      let st, level;
      if (!it){ st = 'Not in stock list: buy ' + (l.qty != null ? fmtN(l.qty, 2) + ' ' + (l.unit || '') : '(qty not set)'); level = 'bad';
        buy.push({label: l.label, qty: l.qty, unit: l.unit, why: 'Needed for ' + c.id + ', not in the stock list', level:'bad', card: c.id}); }
      else if (l.qty == null || !n0(l.qty)){ st = 'Type the quantity needed'; level = 'warn'; }
      else if (n0(it.qty) < 0){ st = 'Taken, but stock is short ' + fmtN(-n0(it.qty), 2) + ' ' + it.unit; level = 'bad'; }
      else { st = 'Ready: ' + fmtN(res[it.id] || l.qty, 2) + ' ' + it.unit + ' set aside'; level = 'ok'; }
      rows.push({label: l.label, item: it ? stockLabel(it) : '', qty: l.qty, unit: it ? it.unit : l.unit, st, level});
    }
    jobs.push({c, rows, bad: rows.filter(r => r.level === 'bad').length, warn: rows.filter(r => r.level === 'warn').length});
  }
  return {buy, jobs};
}

// ---------- Price history ----------
const DAY = 86400000;
const toT = d => new Date(d + 'T00:00:00').getTime();
const fmtD = d => new Date(d + 'T00:00:00').toLocaleDateString('en-IN',{day:'numeric', month:'short', year:'numeric'});
const histOf = id => ((S.hist.get(id) || {}).entries || []);
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs){ const el = document.createElementNS(SVGNS, tag); for (const [k,v] of Object.entries(attrs || {})) el.setAttribute(k, v); return el; }
function svtext(t, attrs){ const el = sv('text', attrs); el.textContent = t; return el; }
function valueAt(entries, t){ let v = null; for (const e of entries){ if (toT(e.date) <= t) v = e.rate; else break; } return v; }
function niceStep(span, n){ const raw = span / n; const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }

// Saves a price with its date. Same-day changes replace each other; an unchanged price is not logged.
function recordPrice(id, value, date, force){
  if (value == null || !S.db) return;
  date = date || today();
  const doc = {rateId:id, entries: histOf(id).map(e => ({...e}))};
  if (!force){ const prev = doc.entries.filter(e => e.date <= date).pop(); if (prev && prev.rate === value) return; }
  doc.entries = doc.entries.filter(e => e.date !== date);
  doc.entries.push({date, rate:value});
  doc.entries.sort((a,b) => a.date.localeCompare(b.date));
  S.hist.set(id, doc);
  scheduleSave('rateHistory/' + id, () => doc, 300);
}
function removePrice(id, date){
  const doc = {rateId:id, entries: histOf(id).filter(e => e.date !== date)};
  S.hist.set(id, doc); scheduleSave('rateHistory/' + id, () => doc, 300);
}
// Colour follows the material: each ticked material keeps its slot until unticked.
function toggleSel(id, on){
  const hs = S.hs;
  if (on){
    if (hs.sel.includes(id) || hs.sel.length >= 6) return;
    const used = new Set(Object.values(hs.slots)); let s = 1; while (used.has(s)) s++;
    hs.slots[id] = s; hs.sel.push(id);
  } else { hs.sel = hs.sel.filter(x => x !== id); delete hs.slots[id]; }
}
function setDefaultSel(){
  const hs = S.hs; hs.sel = []; hs.slots = {};
  ratesSorted().filter(r => r.category === hs.cat && histOf(r.id).length).slice(0, 6).forEach(r => toggleSel(r.id, true));
}

function drawChart(card, groupRates){
  const hs = S.hs, pctMode = hs.mode === 'pct', now = toT(today());
  let series = hs.sel.map(id => S.rates.get(id)).filter(r => r && histOf(r.id).length)
    .map(r => ({r, e: histOf(r.id), slot: hs.slots[r.id]}));
  card.append(h('div',{class:'legend'}, series.map(s => h('span',{class:'lg'}, h('i',{class:'sw', style:'background:var(--s' + s.slot + ')'}), (s.r.name || 'Unnamed') + ' (' + rateUnit(s.r.calc, s.r.unit) + ')'))));
  if (!series.length){
    card.append(h('div',{class:'empty'}, groupRates.some(r => histOf(r.id).length)
      ? 'Tick up to 6 materials in the table below to draw them.'
      : 'No price history in this group yet. Change a rate in the Rate list, or add a past price below, and it will show here.'));
    return;
  }
  let xmin = Math.min(...series.map(s => toT(s.e[0].date)));
  if (hs.range !== 'all') xmin = Math.max(xmin, now - (+hs.range) * 30.44 * DAY);
  if (now - xmin < 30 * DAY) xmin = now - 30 * DAY;
  const xmax = now;
  for (const s of series){
    const pts = [], v0 = valueAt(s.e, xmin);
    if (v0 != null) pts.push({t:xmin, v:v0, real: s.e.some(e => toT(e.date) === xmin)});
    for (const e of s.e){ const t = toT(e.date); if (t > xmin && t <= xmax) pts.push({t, v:e.rate, real:true}); }
    s.pts = pts; s.base = pts.length ? pts[0].v : null;
  }
  series = series.filter(s => s.pts.length);
  const Yv = (s, v) => pctMode ? (s.base ? (v / s.base - 1) * 100 : 0) : v;
  const vals = series.flatMap(s => s.pts.map(p => Yv(s, p.v)));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (pctMode){ lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (hi - lo < 1e-9){ const pad = Math.abs(hi) * 0.1 || 1; lo -= pad; hi += pad; }
  const step = niceStep(hi - lo, 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const W = Math.max(300, Math.round(card.clientWidth - 28)), Hh = W < 560 ? 230 : 290;
  const m = {l:60, r:78, t:10, b:26}, iw = W - m.l - m.r, ih = Hh - m.t - m.b;
  const X = t => m.l + (t - xmin) / (xmax - xmin) * iw;
  const YP = v => m.t + (1 - (v - lo) / (hi - lo)) * ih;
  const dec = step < 1 ? 2 : 0;
  const fmtY = v => pctMode ? (v > 0 ? '+' : '') + fmtN(v, 1) + '%' : '₹' + fmtN(v, dec);
  const svg = sv('svg', {viewBox:'0 0 ' + W + ' ' + Hh, role:'img', 'aria-label':'Graph of material prices over time'});
  const gx = sv('g', {class:'ax'});
  for (let i = 0, v = lo; v <= hi + step / 2; i++, v = lo + i * step){
    const y = YP(v);
    gx.append(sv('line', {x1:m.l, x2:m.l + iw, y1:y, y2:y, class: pctMode && Math.abs(v) < step / 1e6 ? 'base' : 'gridl'}));
    gx.append(svtext(fmtY(v), {x:m.l - 8, y:y + 4, 'text-anchor':'end'}));
  }
  const span = xmax - xmin, ticks = [];
  if (span < 75 * DAY){ for (let i = 0; i <= 4; i++) ticks.push(xmin + span * i / 4); }
  else {
    const d = new Date(xmin); d.setDate(1); d.setMonth(d.getMonth() + 1);
    const months = []; while (d.getTime() <= xmax){ months.push(d.getTime()); d.setMonth(d.getMonth() + 1); }
    const k = Math.max(1, Math.ceil(months.length / Math.max(2, Math.floor(iw / 80))));
    months.forEach((t, i) => { if (i % k === 0) ticks.push(t); });
  }
  for (const t of ticks) gx.append(svtext(new Date(t).toLocaleDateString('en-IN', span < 75 * DAY ? {day:'numeric', month:'short'} : {month:'short', year:'2-digit'}), {x:X(t), y:Hh - 6, 'text-anchor':'middle'}));
  svg.append(gx);
  const labels = [];
  for (const s of series){
    let d = 'M' + X(s.pts[0].t).toFixed(1) + ' ' + YP(Yv(s, s.pts[0].v)).toFixed(1);
    for (let i = 1; i < s.pts.length; i++) d += ' H' + X(s.pts[i].t).toFixed(1) + ' V' + YP(Yv(s, s.pts[i].v)).toFixed(1);
    d += ' H' + X(xmax).toFixed(1);
    svg.append(sv('path', {d, fill:'none', style:'stroke:var(--s' + s.slot + ')', 'stroke-width':'2', 'stroke-linejoin':'round'}));
    for (const p of s.pts) if (p.real) svg.append(sv('circle', {cx:X(p.t).toFixed(1), cy:YP(Yv(s, p.v)).toFixed(1), r:'4', style:'fill:var(--s' + s.slot + ');stroke:var(--surface)', 'stroke-width':'2'}));
    const last = s.pts[s.pts.length - 1];
    labels.push({y: YP(Yv(s, last.v)), text: pctMode ? fmtY(Yv(s, last.v)) : rs2(last.v)});
  }
  labels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 14) labels[i].y = labels[i - 1].y + 14;
  for (const L of labels) svg.append(svtext(L.text, {x:m.l + iw + 8, y:(L.y + 4).toFixed(1), class:'endlab'}));
  const xh = sv('line', {class:'xhair', y1:m.t, y2:m.t + ih, visibility:'hidden'}); svg.append(xh);
  const hit = sv('rect', {x:m.l, y:m.t, width:iw, height:ih, fill:'transparent'}); svg.append(hit);
  const wrap = h('div',{class:'chart'}); wrap.append(svg); card.append(wrap);
  const tip = h('div',{class:'tip'}); tip.hidden = true; card.append(tip);
  const move = ev => {
    const rect = svg.getBoundingClientRect(), sc = W / rect.width;
    const px = (ev.clientX - rect.left) * sc;
    const t = Math.min(xmax, Math.max(xmin, xmin + (px - m.l) / iw * (xmax - xmin)));
    const x = X(t); xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
    tip.replaceChildren(h('div',{class:'fl'}, new Date(t).toLocaleDateString('en-IN',{day:'numeric', month:'short', year:'numeric'})),
      ...series.map(s => { const v = valueAt(s.e, t);
        return h('div',{class:'tr'}, h('span',{class:'lg'}, h('i',{class:'sw', style:'background:var(--s' + s.slot + ')'}), s.r.name || 'Unnamed'),
          h('b',{}, v == null ? '—' : pctMode ? fmtY(Yv(s, v)) : rs2(v))); }));
    tip.hidden = false;
    const cr = card.getBoundingClientRect();
    let left = ev.clientX - cr.left + 14;
    if (left + tip.offsetWidth > card.clientWidth) left = ev.clientX - cr.left - tip.offsetWidth - 14;
    tip.style.left = Math.max(4, left) + 'px'; tip.style.top = (ev.clientY - cr.top + 12) + 'px';
  };
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); });
  if (!pctMode && new Set(series.map(s => rateUnit(s.r.calc, s.r.unit))).size > 1)
    card.append(h('div',{class:'note'},'These materials use different units. Switch “Show” to “% change from start” to compare them fairly.'));
}
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => {
  if (S.view === 'history' && !$('#view-history').contains(document.activeElement)) renderHistory();
}, 200); });

// ---------- data ----------
function msg(text, err){ $('#sysmsg').replaceChildren(text ? h('div',{class:'banner' + (err ? ' err' : '')}, text) : ''); }
async function boot(){
  S.role = null; render();
  const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  if (!db){ S.role = 'owner'; msg('Saved data is not available in this view. Open the page in Claude while signed in to use the costing tool.', true); fromHash(); return; }
  S.db = db;
  // Inside Claude this page is now only a preview of the next app version.
  if (!window.FIRSTBOX_CLOUD) msg('Preview of the next Firstbox app version. Try changes here; do your real work in the Firstbox app (data here is separate).');
  const slowTimer = setTimeout(() => { if (!S.loaded.jobs || !S.loaded.rates){ S.slow = true; render(); } }, 10000);
  const doneLoading = () => { if (S.loaded.jobs && S.loaded.rates){ clearTimeout(slowTimer); S.slow = false; } };
  const fail = e => { clearTimeout(slowTimer); msg(e && e.code === 'revoked' ? 'Access to saved data ended for this page.' : "Couldn't load your saved data. Reload the page to try again.", true); };

  const user = window.claude.use ? await window.claude.use('user') : null;
  S.user = user;
  const owner = user ? await user.isOwner() : false;
  if (user && user.me) user.me().then(m => { S.myName = String((m && m.name) || '').trim().split(/[\s,–-]+/)[0] || ''; homeSoon(); }).catch(() => {});
  db.doc('shared/lists').onSnapshot(s => {
    if (!busy('shared/lists')) S.shared = s.exists ? (s.data() || {}) : {};
    S.loaded.shared = true; publishSharedLists();
  }, () => { S.loaded.shared = true; });
  const startTeamData = () => {
    if (S.teamStarted) return; S.teamStarted = true;
    // Once both lists have loaded, bring every job card's stock up to date (only differences move).
    const initialStockSync = () => { if (S.didStockSync || !S.loaded.stock || !S.loaded.cards) return; S.didStockSync = true; setTimeout(() => syncAllCards('Stock check'), 500); };
    const liveSub = (col, key, view, renderFn) => db.collection(col).onSnapshot(snap => {
      const m = new Map();
      for (const d of snap.docs){ const path = col + '/' + d.id; m.set(d.id, busy(path) && S[key].has(d.id) ? S[key].get(d.id) : {...d.data(), id:d.id}); }
      for (const [id, x] of S[key]) if (!m.has(id) && busy(col + '/' + id)) m.set(id, x);
      S[key] = m;
      if (!snap.metadata.fromCache && col === 'stock') S.loaded.stock = true;
      initialStockSync();
      if (S.view === 'stock' && !$('#view-stock').contains(document.activeElement)) renderStock();
      homeSoon();
      if (S.view === 'card' && S.cardTab === 'mat' && !$('#view-card').contains(document.activeElement)) renderCard();
    }, fail);
    liveSub('stock', 'stock'); liveSub('stockLog', 'slog');

    db.collection('jobcards').onSnapshot(snap => {
      const m = new Map();
      for (const d of snap.docs){ const path = 'jobcards/' + d.id; m.set(d.id, busy(path) && S.cards.has(d.id) ? S.cards.get(d.id) : {...d.data(), id:d.id}); }
      for (const [id, c] of S.cards) if (!m.has(id) && busy('jobcards/' + id)) m.set(id, c);
      S.cards = m;
      if (!snap.metadata.fromCache) S.loaded.cards = true;
      initialStockSync();
      homeSoon();
    if (S.view === 'cards'){ if (!$('#view-cards').contains(document.activeElement) || document.activeElement === document.body) renderCards(); }
      else if (S.view === 'card'){
        const fresh = S.cards.get(S.cardId);
        if (!S.cdraft && fresh){ S.cdraft = clone(fresh); renderCard(); }
        else if (S.cdraft && !fresh && S.loaded.cards && !busy('jobcards/' + S.cardId)){ S.cdraft = null; renderCard(); }
        else if (S.cdraft && fresh && !busy('jobcards/' + S.cardId) && stable(fresh) !== stable(S.cdraft) && !$('#view-card').contains(document.activeElement)){ S.cdraft = clone(fresh); renderCard(); }
        else if (!S.cdraft) renderCard();
      } else if (S.view === 'job' && S.draft && !$('#view-job').contains(document.activeElement)) renderJob();
    }, fail);

  };
  const listSub = (col, key) => db.collection(col).onSnapshot(snap => {
    const m = new Map();
    for (const d of snap.docs){ const path = col + '/' + d.id; m.set(d.id, busy(path) && S[key].has(d.id) ? S[key].get(d.id) : {...d.data(), id:d.id}); }
    S[key] = m;
    if (S.view === 'team' && !$('#view-team').contains(document.activeElement)) renderTeam();
  }, () => {});
  if (owner){
    S.role = 'owner'; fromHash();
    db.doc('config/defaults').onSnapshot(s => {
      if (busy('config/defaults')) return;
      if (s.exists){ S.settings = {...S.settings, ...s.data()}; if (S.view === 'rates' && !$('#view-rates').contains(document.activeElement)) renderRates(); }
    }, () => {});

    db.collection('rates').onSnapshot(snap => {
      const m = new Map();
      for (const d of snap.docs){ const path = 'rates/' + d.id; m.set(d.id, busy(path) && S.rates.has(d.id) ? S.rates.get(d.id) : {...d.data(), id:d.id}); }
      for (const [id, r] of S.rates) if (!m.has(id) && busy('rates/' + id)) m.set(id, r);
      S.rates = m;
      if (!snap.metadata.fromCache){ S.loaded.rates = true; doneLoading(); publishSharedLists(); }
      if (S.view === 'rates'){
        const box = $('#rates-box');
        if (box && box.contains(document.activeElement)) S.ratesDeferred = true; else renderRates();
      }
    }, fail);

    db.collection('rateHistory').onSnapshot(snap => {
      const m = new Map();
      for (const d of snap.docs){ const path = 'rateHistory/' + d.id; m.set(d.id, busy(path) && S.hist.has(d.id) ? S.hist.get(d.id) : d.data()); }
      for (const [id, hh] of S.hist) if (!m.has(id) && busy('rateHistory/' + id)) m.set(id, hh);
      S.hist = m;
      if (!snap.metadata.fromCache) S.loaded.hist = true;
      if (S.view === 'history' && !$('#view-history').contains(document.activeElement)) renderHistory();
    }, fail);

    db.collection('jobs').onSnapshot(snap => {
      const m = new Map();
      for (const d of snap.docs){ const path = 'jobs/' + d.id; m.set(d.id, busy(path) && S.jobs.has(d.id) ? S.jobs.get(d.id) : {...d.data(), id:d.id}); }
      for (const [id, j] of S.jobs) if (!m.has(id) && busy('jobs/' + id)) m.set(id, j);
      S.jobs = m;
      if (!snap.metadata.fromCache){ S.loaded.jobs = true; doneLoading(); }
      homeSoon();
    if (S.view === 'jobs'){ if (!$('#view-jobs').contains(document.activeElement) || document.activeElement === document.body) renderJobs(); }
      else if (S.view === 'job'){
        const fresh = S.jobs.get(S.jobId);
        if (!S.draft && fresh){ S.draft = clone(fresh); renderJob(); }
        else if (S.draft && !fresh && S.loaded.jobs && !busy('jobs/' + S.jobId)){ S.draft = null; renderJob(); }
        else if (S.draft && fresh && !busy('jobs/' + S.jobId) && stable(fresh) !== stable(S.draft) && !$('#view-job').contains(document.activeElement)){ S.draft = clone(fresh); renderJob(); }
      }
    }, fail);
    listSub('team', 'team'); listSub('requests', 'requests');
    db.collection('pastwork').onSnapshot(snap => {
      const m = new Map();
      for (const d of snap.docs){ const path = 'pastwork/' + d.id; m.set(d.id, busy(path) && S.past.has(d.id) ? S.past.get(d.id) : {...d.data(), id:d.id}); }
      for (const [id, x] of S.past) if (!m.has(id) && busy('pastwork/' + id)) m.set(id, x);
      S.past = m; if (!snap.metadata.fromCache) S.loaded.past = true;
      if (S.view === 'past' && !$('#view-past').contains(document.activeElement)) renderPast();
      if (S.view === 'job') showOtherDims();
    }, () => { S.loaded.past = true; });
    startTeamData();
    return;
  }
  clearTimeout(slowTimer);
  const myId = user ? await user.id() : null;
  if (!myId){ S.role = 'noid'; render(); return; }
  S.myId = myId;
  db.doc('requests/' + myId).onSnapshot(s => { S.myRequest = s.exists ? s.data() : null; if (!ROLES[S.role]) render(); }, () => {});
  db.doc('team/' + myId).onSnapshot(s => {
    const d = s.exists ? s.data() : null, r = d && ROLES[d.role] ? d.role : 'none', was = S.role;
    S.role = r;
    if (ROLES[r]) startTeamData();
    if (was !== r){ if (ROLES[r]) fromHash(); else render(); }
  }, () => { S.role = 'none'; render(); });
}
const barEl = document.querySelector('.bar');
const setBarH = () => document.documentElement.style.setProperty('--barh', barEl.offsetHeight + 'px');
setBarH(); window.addEventListener('resize', setBarH);
boot();
})();
