<title>Firstbox Costing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: white app with a Halloween-orange brand bar; a costing is a column of five numbered calculators with a sticky jump bar, beside a sticky totals panel (stacks on phones). Single light theme by design: Firstbox brand is white + orange. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#FFF4ED; --line:#EEE2DA; --fg:#1F1A16; --muted:#6B6058;
  --brand:#EB6123; --brand-strong:#D4531A; --accent:#B8470F; --accent-ink:#FFFFFF; --accent-soft:#FDEBDF;
  --good:#1C7743; --good-soft:#E0F1E7; --bad:#B3322A; --bad-soft:#F7E3E1; --warn:#7A5A00; --warn-soft:#FBF1D2;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{overflow-anchor:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--brand)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;margin-right:8px}
.brand img{display:block;height:42px;width:auto}
.bar .tab{white-space:nowrap}
.bar .wrap{max-width:1340px}
@media (min-width:641px){.bar nav{gap:0}.bar .tab{padding:8px 7px;font-size:14px}.bar .wrap{gap:10px}}   /* 8 tabs for the owner still fit on one line */
.setwrap{position:relative}
/* Home tiles */
.brand.home-link{cursor:pointer}
#view-home{max-width:1000px;margin:0 auto}
.on-home .bar{display:none}
.hhero{position:relative;display:grid;justify-items:center;text-align:center;gap:4px;padding:18px 0 0}
.hlogo{width:min(260px,64vw);height:auto;margin-bottom:18px}
.hhero h1{font-size:22px}
.hhero .note{font-size:14px}
.hsignout{position:absolute;top:0;right:0}
.hdivider{border:0;height:1px;background:var(--line);margin:26px 0 22px;position:relative;overflow:visible}
.hdivider::after{content:"";position:absolute;left:50%;top:-1px;width:56px;height:3px;margin-left:-28px;background:var(--brand);border-radius:2px}
.hsub{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.hsub::after{content:"";flex:1;height:1px;background:var(--line)}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.hgrid.work{grid-template-columns:repeat(4,1fr)}
.hgrid.work .htile{grid-column:auto}
.hgrid.set{grid-template-columns:repeat(5,1fr)}
@media (max-width:1000px){.hgrid.work,.hgrid.set{grid-template-columns:repeat(2,1fr)}.hgrid.work .htile{grid-column:auto}}
@media (max-width:760px){.hgrid,.hgrid.work,.hgrid.set{grid-template-columns:1fr}}
.htile{display:flex;align-items:center;gap:16px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;font:inherit;color:var(--fg);cursor:pointer;min-height:108px;transition:box-shadow .15s,border-color .15s,transform .15s}
.htile:hover,.htile:focus-visible{border-color:var(--brand);box-shadow:0 8px 24px rgba(31,26,22,.08);transform:translateY(-1px)}
.htile:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hicon{flex:none;display:grid;place-items:center;width:50px;height:50px;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.htext{display:grid;gap:3px}
.htitle{font-family:var(--font-display);font-weight:700;font-size:19px}
.hdesc{font-size:13.5px;color:var(--muted);line-height:1.4}
.htile.small{min-height:84px;padding:14px 16px}
.htile.small .hicon{width:40px;height:40px;border-radius:10px}
.htile.small .htitle{font-size:16px}
.rowdel{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border:1px solid transparent;border-radius:6px;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;font-weight:600;white-space:nowrap}
.rowdel:hover,.rowdel:focus-visible{color:var(--neg,#B42318);border-color:var(--line);background:var(--surface)}
.rowdel.armed{color:#fff;background:#B42318;border-color:#B42318}
td.act,th.act{width:1%;text-align:right;padding-left:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.setbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.setbtn:hover,.setbtn[aria-expanded="true"]{color:var(--accent);border-color:var(--brand);background:var(--accent-soft)}
.setbtn.on{color:var(--accent);background:var(--accent-soft);border-color:var(--brand)}
.setmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:20;min-width:280px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:8px;box-shadow:0 10px 30px rgba(31,26,22,.14);padding:6px;display:grid;gap:2px}
.setmenu[hidden]{display:none}
.setmenu-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}
.setmenu button{display:grid;gap:2px;text-align:left;background:none;border:0;border-radius:6px;padding:9px 10px;font:inherit;cursor:pointer;color:var(--fg)}
.setmenu button b{font-size:15px;font-weight:600}
.setmenu button span{font-size:12px;color:var(--muted)}
.setmenu button:hover,.setmenu button:focus-visible{background:var(--accent-soft)}
.setmenu button[aria-current="page"] b{color:var(--accent)}
.brand-sub{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:10px}
.tslogo{display:block;height:40px;width:auto;margin-bottom:6px}
.bar nav{display:flex;gap:4px}
.tab{background:none;border:0;padding:9px 14px;border-radius:6px;font:inherit;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 -3px 0 var(--brand)}
.tab:hover{color:var(--fg)}
.spacer{flex:1}
.savestate{font-size:12px;color:var(--muted)}
.savestate.err{color:var(--bad)}
.savestate.dirty{color:var(--accent);font-weight:600}
.savebtn{min-width:92px}
.savebtn.saved{color:var(--muted);background:var(--surface);opacity:1}
.savefoot{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
dialog.leave{border:0;border-radius:14px;padding:22px 24px;max-width:min(440px,calc(100vw - 32px));box-shadow:0 20px 50px rgba(31,26,22,.25);color:var(--fg);background:var(--surface)}
dialog.leave::backdrop{background:rgba(31,26,22,.35)}
dialog.leave h2{margin:0 0 6px}
dialog.leave p{margin:0 0 16px;color:var(--muted)}
dialog.leave .bad{color:var(--bad)}
dialog.leave .row{justify-content:flex-end;flex-wrap:wrap}
main{padding-block:20px 60px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:6px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand-strong);border-color:var(--brand-strong);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:var(--brand);border-color:var(--brand)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{padding:4px 9px;font-size:13px}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
input[type=number]{text-align:right}
textarea{width:100%;resize:vertical;min-height:60px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin-bottom:16px;font-weight:500}
.banner.err{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}

/* Jobs view */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:8px;padding:12px 14px}
.kpi .v{font-family:var(--font-display);font-size:22px;font-weight:600;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.tablebox{position:relative;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
td.n,th.n{text-align:right}
tbody tr:last-child td{border-bottom:0}
.jobs tbody tr{cursor:pointer}
.jobs tbody tr:hover{background:var(--accent-soft)}
.jobno{font-weight:600}
.sub{font-size:12px;color:var(--muted);white-space:normal;max-width:280px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.pill.Quoted{background:var(--accent-soft);color:var(--accent)}
.pill.Confirmed{background:var(--warn-soft);color:var(--warn)}
.pill.Completed{background:var(--good-soft);color:var(--good)}
.pill.Lost{background:var(--bad-soft);color:var(--bad)}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:middle}
.empty{padding:28px;text-align:center;color:var(--muted)}
.newjob{background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:14px;margin-bottom:16px;display:grid;gap:12px}
.newjob .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* Job sheet */
.sheet{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:920px){.sheet{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.details .wide{grid-column:span 2}
@media (max-width:420px){.details .wide{grid-column:span 1}}
.lines{display:grid;gap:10px;margin-top:10px}
.line{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px}
.line-top{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.line-top .name{flex:1 1 200px}
.line-top .name input{width:100%;font-weight:600}
.line-top .rsel{flex:0 1 230px}
.line-top .rsel select{width:100%}
.ctype{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.fields{display:flex;flex-wrap:wrap;gap:8px}
.fields input{width:92px}
.fields select{max-width:220px}
.line-foot{display:flex;gap:10px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}
.detail{font-size:12px;color:var(--muted);flex:1 1 220px}
.amt{text-align:right}
.amt .fl{display:block}
.amt b{font-size:16px;font-family:var(--font-display);font-weight:600}
.actual input{width:110px}
.adds{display:flex;flex-wrap:wrap;gap:6px}
.adds .btn{border:1px dashed var(--brand);color:var(--accent);background:var(--surface)}
.adds .btn:hover{background:var(--accent-soft)}
.part{display:grid;gap:10px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--barh, 58px) + 76px)}
.part-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--brand);padding-bottom:8px;margin-top:10px}
.part-title{display:flex;gap:12px;align-items:flex-start;min-width:0}
.pnum{flex:none;width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;font-family:var(--font-display);font-weight:700;font-size:16px;display:grid;place-items:center;margin-top:2px}
.fold{background:none;border:0;padding:2px 0;color:var(--accent);font-weight:600;font-size:12px;cursor:pointer}
.part.folded .lines,.part.folded .adds{display:none}
.jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh, 58px) + 4px);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;gap:6px;overflow-x:auto;box-shadow:0 4px 12px rgba(31,26,22,.06)}
.jump button{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:7px;padding:6px 10px;font:inherit;color:var(--fg);cursor:pointer;text-align:left}
.jump button:hover{background:var(--accent-soft)}
.jump .jn{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
.jump .jt{display:grid;line-height:1.2}
.jump .jt span{font-size:12px;color:var(--muted)}
.jump .jt b{font-size:13px}
.part-head .ctype{font-size:11px}
.part-head .amt b{font-size:20px}
.ohrow{background:var(--sunk)}
.totals{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh, 58px) + 8px);display:grid;gap:14px}
@media (max-width:920px){.totals{position:static}}
.tl{display:grid;gap:7px}
.tr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tr input{width:96px}
.tr.big{font-family:var(--font-display);font-size:20px;font-weight:700;border-top:2px solid var(--brand);padding-top:8px}
.tr.key{background:var(--accent-soft);margin:0 -8px;padding:8px;border-radius:6px;font-weight:700;border-left:4px solid var(--brand)}
.result{border-radius:8px;padding:10px 12px;font-weight:600}
.result.pos{background:var(--good-soft)} .result.neg{background:var(--bad-soft)}
.result .big{font-family:var(--font-display);font-size:22px}
.sect{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.formula{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}

/* Rates */
.rates td{vertical-align:middle}
.rates input,.rates select{width:100%}
.rates td.w-name{min-width:220px}
.rates td.w-num{width:96px;min-width:86px}
.defaults{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.defaults input{width:90px}
.cat-row td{background:var(--sunk);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
/* Price history */
.hctl{margin-bottom:14px;align-items:flex-end}
.chartcard{position:relative;margin-bottom:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:8px;font-size:13px}
.lg{display:inline-flex;align-items:center;gap:6px;min-width:0}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax text{fill:var(--muted);font-size:11px}
.gridl{stroke:var(--line);stroke-width:1}
.base{stroke:var(--muted);stroke-width:1}
.endlab{fill:var(--fg);font-size:12px;font-weight:600}
.xhair{stroke:var(--muted);stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);min-width:170px;z-index:2;display:grid;gap:3px}
.hist tr.focus td{background:var(--accent-soft)}
.tip[hidden]{display:none}
.sheetgrp{border:2px solid var(--brand);border-radius:12px;padding:10px;display:grid;gap:10px;background:#FFFAF6}
.sheetgrp.other{border-style:dashed}
.sheetgrp .lines{margin-top:0}
.sghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sgnum{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--accent)}
.sgamt{font-size:13px;color:var(--muted)} .sgamt b{color:var(--fg);font-size:15px}
.line.psheet{border-color:var(--brand)}
.coatpick select{font-weight:600;min-width:200px}
.fields input.bigin{width:150px;font-size:16px;font-weight:600;padding:8px 10px;border-color:var(--brand)}
.pastels{display:grid;gap:6px;background:var(--sunk);border-radius:8px;padding:10px}
.prow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--brand);border-radius:999px;padding:3px 4px 3px 12px}
.pname{font-weight:600}
.pups{display:flex;align-items:center;gap:4px}
.pups input{width:62px;padding:3px 6px}
.pdel{border:0;background:none;color:var(--bad);font-size:18px;line-height:1;padding:0 6px;cursor:pointer}

/* Job cards */
.jcsec{display:grid;gap:10px}
.jcrow{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.jcrow input,.jcrow select{width:100%}
.jcrow .fld{flex:1 1 110px}
.jcrow .fld.w2{flex:2 1 200px}
.jcrow .fld.w0{flex:0 1 80px}
.card .grid,.billitem .grid,.inv-pbox .grid,.inv-party .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid .fld.wide{grid-column:span 2}
@media (max-width:520px){.grid .fld.wide{grid-column:auto}}
.billitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;background:var(--surface)}
/* Invoice editor, laid out like Refrens, in Firstbox colours */
.inv{display:grid;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px}
.inv .ic{display:inline-flex;vertical-align:middle}
.inv-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}
.inv-title{font-size:32px;font-weight:600;color:var(--brand);letter-spacing:-.01em}
.inv-meta{display:grid;grid-template-columns:auto minmax(170px,230px);gap:8px 16px;align-items:center;margin-top:14px}
.inv-meta label{color:var(--muted);font-size:14px}
.req{color:var(--accent);margin-left:2px}
input[type=date]{cursor:pointer}
.inv-sum{display:grid;gap:2px;justify-items:end;text-align:right;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:240px}
.inv-sum-l{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.inv-sum-v{font-size:28px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;line-height:1.2}
.inv-sum-s{font-size:14px;color:var(--accent);font-weight:600}
.inv-sum-c{font-size:13px;color:var(--muted);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:860px){.inv-sum{justify-items:start;text-align:left;width:100%}}
.inv-two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}

.tsdrow{display:grid;grid-template-columns:26px minmax(150px,1fr) 2.2fr 20px;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}

.tsdn{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:700}
.tsdk{font-weight:600}

/* Left-side menu (Raj): logo centred in the top bar, Sign out at the end; sections on the left. */
:root{--sidew:252px}

/* Raj: no menu on Home (the tiles show everything); elsewhere it stays tucked away behind ☰ and opens when the mouse goes over ☰ */
.on-home .menubtn,.on-home .side,.on-home .sideshade{display:none!important}

  const quoteProfit = quoteValue != null ? quoteValue - total : null;
  const actualTotal = actSub * (1 + oh);
  const soldQty = qty; // the ordered quantity is always what is dispatched
  const price = j.soldPrice ?? j.quotePrice ?? null;
  const sales = price != null ? price * soldQty : null;
  const profit = sales != null ? sales - actualTotal : null;
  return {res, sub, partSub, qty, overhead: sub*oh, total, perPc, suggested, quoteValue, quoteProfit,
    actualTotal, actualPerPc: qty ? actualTotal/qty : 0, actualCount, lineCount: lines.length, soldQty, sales, profit};
}
// What a job counts as in reports: actual figures once completed, otherwise the estimate.
function jobFigures(j){
  const c = computeJob(j), done = false; // no status any more: always estimate cost vs quoted price

  const pricePc = done ? (j.soldPrice ?? j.quotePrice) : (j.quotePrice ?? null);
  const cost = done ? c.actualTotal : c.total;
  const value = done ? (pricePc != null ? pricePc * c.soldQty : null) : (pricePc != null ? pricePc * n0(j.qty) : null);
  const profit = value != null ? value - cost : null;
  return {c, costPc, pricePc, cost, value, profit, onCost: profit != null && cost ? profit / cost * 100 : null};
}

const hashFor = (view, id) => view === 'job' ? '#job-' + id : view === 'card' ? '#card-' + id : view === 'order' ? '#order-' + id : view === 'bill' ? '#bill-' + id : view === 'pay' ? '#pay-' + id : '#' + view;

  const hash = hashFor(view, id);

// Separate databases per product: rigid boxes, mono cartons, corrugated boxes, MDF boxes. Quotes only compare like with like.
const PCATS = {rigid:'Rigid boxes', mono:'Mono cartons', corrugated:'Corrugated boxes', mdf:'MDF boxes'};
const catOf = e => e.cat || (RIGID.has(e.boxType) ? 'rigid' : ['mono','mdf','corrugated','printing'].includes(e.boxType) ? e.boxType : 'rigid');
// Entries: saved ones (`pastwork/<id>`: imported from the old Excel sheet or added by hand) plus every costing
// that has a quoted price (added automatically, always up to date). Sizes are kept in mm.
function pastEntries(){
  const out = [];
  for (const p of S.past.values()) out.push({...p, source: p.source || 'saved'});
  if (S.role !== 'owner'){
    for (const [id, e] of S.priceBook) out.push({...e, id:'pb:' + id, source:'costing'});
    return out;
  }
  for (const j of S.jobs.values()){
    const price = j.quotePrice ?? null;
    if (price == null || price === '') continue;
    out.push({id:'job:' + j.id, jobId:j.id, client:j.client || '', item:j.description || '', boxType:j.boxType || '', l:j.l ?? null, w:j.w ?? null, h:j.h ?? null,
      qty:j.qty ?? null, pricePc:n0(price), date:j.date || '', notes:'', source:'costing'});
  }
  return out;
}
// How far a past size is from the one searched (mm). Length and width may be swapped; height must match height.
function sizeGap(e, q){
  const has = v => v != null && v !== '' && !isNaN(v);
  const d = (a, b) => has(a) && has(b) ? Math.abs(n0(a) - n0(b)) : null;
  const opts = [[d(e.l, q.l), d(e.w, q.w)], [d(e.l, q.w), d(e.w, q.l)]].map(p => p.concat([d(e.h, q.h)]));
  let best = null;
  for (const o of opts){
    const asked = [q.l, q.w, q.h].filter(has).length; if (!asked) return null;
    const vals = o.filter(v => v != null);
    if (vals.length < asked) continue; // the past entry is missing a size that was searched
    const m = Math.max(...vals);
    if (best == null || m < best.max) best = {max: m, diffs: o};
  }
  return best;
}

// ---------- Orders (client POs) and dispatches ----------
// A PO has variants (e.g. Oud, Icy, Sandal) each with an ordered quantity. Each dispatch records how many of
// each variant went in that lot (mix and match). Delivered and remaining are worked out from the dispatches.
// orders/<id>: client, poNo, poDate, item, notes, variants:[{id,name,qty}], dispatches:[{id,lot,date,ref,note,items:{variantId:qty},by,at}]
// poRates/<id>: {rate} — price per piece, the same for every variant of the PO. Owner only.
function poStats(o){
  const vs = o.variants || [], del = {};
  vs.forEach(v => del[v.id] = 0);
  for (const d of o.dispatches || []) for (const [vid, q] of Object.entries(d.items || {})) del[vid] = (del[vid] || 0) + n0(q);
  const ordered = vs.reduce((a, v) => a + n0(v.qty), 0);
  const delivered = vs.reduce((a, v) => a + n0(del[v.id]), 0);
  const remaining = vs.reduce((a, v) => a + Math.max(0, n0(v.qty) - n0(del[v.id])), 0);
  const status = !ordered || delivered <= 0 ? 'none' : remaining <= 0 ? 'done' : 'part';
  const last = (o.dispatches || []).map(d => d.date || '').sort().pop() || '';
  return {del, ordered, delivered, remaining, status, last, pct: ordered ? Math.min(100, delivered / ordered * 100) : 0};
}
// Several POs from one client can run at the same time at different rates. Dispatches always finish the

// Each part is saved on its PO with the same `lot` id, so the rate of every piece sent is known.
const normC = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
const lotOf = d => d.lot || d.id;
const sameLot = (d, lot) => lotOf(d) === lot;
function clientPOs(client){

    .sort((a, b) => String(a.poDate || '').localeCompare(String(b.poDate || '')) || n0(a.createdAt) - n0(b.createdAt));
}
// Delivered per variant of a PO, leaving out one dispatch lot (the one being edited).
function delExcept(o, lot){
  const del = {};

// Split pieces of each variant (keyed by normalised name) over the client's POs, oldest first. Pieces beyond

function allocate(client, qtyByName, lot){

    if (!cands.length) continue;
    for (const c of cands){ if (need <= 0) break; const take = Math.min(Math.max(0, n0(c.v.qty) - n0(delExcept(c.o, lot)[c.v.id])), need); if (take > 0){ out.push({o:c.o, v:c.v, q:take}); need -= take; } }

// Numbered list editor: one input per line, like Refrens. The value is kept as text, one line per term.
function termsBox(title, text, onChange, ph){
  let lines = String(text || '').split('\n').map(s => s.trim()).filter(Boolean);
  const box = h('section',{class:'inv-terms'});
  const save = () => onChange(lines.map(s => s.trim()).filter(Boolean).join('\n'));
  const draw = (focusLast) => {
    box.replaceChildren(h('h2',{}, title),
      ...lines.map((t, i) => h('div',{class:'inv-term'},
        h('span',{class:'inv-num'}, String(i + 1).padStart(2, '0')),
        h('textarea',{rows:'1', 'aria-label': title + ' ' + (i + 1), placeholder: ph, oninput:e => { lines[i] = e.target.value; e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; save(); }}, t),
        h('button',{type:'button', class:'iconbtn', title:'Remove', 'aria-label':'Remove ' + title.toLowerCase() + ' ' + (i + 1), onclick:() => { lines.splice(i, 1); save(); draw(); }}, icon('x')))),
      h('button',{type:'button', class:'inv-link', onclick:() => { lines.push(''); draw(true); }}, icon('plus'), lines.length ? ' Add new line' : ' Add ' + title.toLowerCase()));
    requestAnimationFrame(() => { box.querySelectorAll('textarea').forEach(t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }); if (focusLast){ const all = box.querySelectorAll('textarea'); if (all.length) all[all.length - 1].focus(); } });
  };
  draw();
  return box;
}

async function downloadBill(b, btn){
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Making PDF…';
  const say = t => { const a = $('#bill-alert'); if (a) a.replaceChildren(h('div',{class:'banner'}, t)); };
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (!dl){ say('Downloading isn’t available in this view.'); return; }
    let bytes;
    try { bytes = await buildBillPdf(b); } catch(e){ console.error(e); say('Couldn’t make the PDF. Check your internet connection and try again.'); return; }
    const name = ((b.type === 'proforma' ? 'Proforma ' : 'Tax invoice ') + (b.no || '') + ' ' + ((b.client || {}).name || '')).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim() + '.pdf';
    try { const res = await dl.save({filename: name, data: new Blob([bytes], {type:'application/pdf'})}); btn.textContent = res && res.path ? 'Saved' : 'Downloaded'; if (res && res.path) say('Saved to ' + res.path); setTimeout(() => btn.textContent = label, 2000); return; }
    catch(e){ if (e && e.code === 'declined') return; say('The download didn’t work here. Try again.'); }
  } finally { btn.disabled = false; if (btn.textContent === 'Making PDF…') btn.textContent = label; }
}

// ----- PDF, laid out like the Refrens invoices -----
async function buildBillPdf(b){
  const {PDFDocument, StandardFonts, rgb} = await loadPdfLib();
  const cfg = billCfg(), calc = billCalc(b), pf = b.type === 'proforma', dc = b.type === 'challan', inter = calc.inter, cl = b.client || {};
  const doc = await PDFDocument.create();
  doc.setTitle(BILL_TITLE[b.type] + ' ' + (b.no || '')); doc.setAuthor(cfg.name || 'Firstbox');
  const F = await doc.embedFont(StandardFonts.Helvetica), FB = await doc.embedFont(StandardFonts.HelveticaBold);
  const W = 595.28, H = 841.89, M = 28, BW = W - 2 * M;
  const BLUE = rgb(0.92, 0.38, 0.137), HEAD = rgb(0.92, 0.38, 0.137), SOFT = rgb(0.992, 0.922, 0.875), ROWA = rgb(1, 0.973, 0.953), INK = rgb(0.1, 0.1, 0.12), GREY = rgb(0.42, 0.42, 0.45), WHITE = rgb(1, 1, 1);
  let page = doc.addPage([W, H]);
  // Standard fonts have no ₹, so the sign is drawn as lines.
  const RUP = 0.6;
  const tw = (t, f, s) => String(t == null ? '' : t).split('₹').reduce((a, p) => a + f.widthOfTextAtSize(pdfSafe(p), s), 0) + (String(t == null ? '' : t).split('₹').length - 1) * RUP * s;
  const rupee = (x, y, s, color, bold) => page.drawSvgPath('M 60 -700 L 540 -700 M 60 -555 L 540 -555 M 175 -700 C 470 -700 470 -400 175 -400 L 120 -400 L 470 0', {x, y, scale: s / 1000, borderColor: color, borderWidth: bold ? 85 : 62});
  const text = (t, x, y, f, s, color) => { color = color || INK; let cx = x; String(t == null ? '' : t).split('₹').forEach((p, i) => { if (i){ rupee(cx, y, s, color, f === FB); cx += RUP * s; } if (p){ const q = pdfSafe(p); page.drawText(q, {x: cx, y, size: s, font: f, color}); cx += f.widthOfTextAtSize(q, s); } }); return cx; };
  const textR = (t, xr, y, f, s, c) => text(t, xr - tw(t, f, s), y, f, s, c);
  const textC = (t, xc, y, f, s, c) => text(t, xc - tw(t, f, s) / 2, y, f, s, c);
  const wrap = (t, f, s, w) => { const out = []; for (const para of String(t == null ? '' : t).split('\n')){ let cur = ''; for (const word of para.split(/\s+/).filter(Boolean)){ const nx = cur ? cur + ' ' + word : word; if (tw(nx, f, s) <= w || !cur) cur = nx; else { out.push(cur); cur = word; } } out.push(cur); } return out; };
  const rrect = (x, yTop, w, hgt, color, r) => { r = r ?? 6; page.drawSvgPath(`M ${r} 0 H ${w - r} Q ${w} 0 ${w} ${r} V ${hgt - r} Q ${w} ${hgt} ${w - r} ${hgt} H ${r} Q 0 ${hgt} 0 ${hgt - r} V ${r} Q 0 0 ${r} 0 Z`, {x, y: yTop, color}); };
  const money = v => '₹' + inr2.format(r2(v));
  const rateTxt = v => v == null ? '' : '₹' + new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}).format(n0(v));

  // Header: title, number, date; logo on the right.
  text(pf ? 'Proforma Invoice' : dc ? 'DELIVERY CHALLAN' : 'TAX INVOICE', M, H - 60, F, 24, BLUE);
  text(dc ? 'Challan No' : 'Invoice No', M + 1, H - 90, F, 9, GREY); text(b.no || '', M + 70, H - 90, FB, 9);
  text(dc ? 'Challan Date' : 'Invoice Date', M + 1, H - 108, F, 9, GREY); text(billDate(b.date), M + 70, H - 108, FB, 9);
  const pos = GST_STATES[cl.state] ? GST_STATES[cl.state] + ' (' + cl.state + ')' : '';
  const ewb = !pf && b.transport && b.transport.on ? String(b.transport.eway || '').trim() : '';
  if (pos) { text('Place of Supply', M + 190, H - 90, F, 9, GREY); text(pos, M + 270, H - 90, FB, 9); }
  if (ewb) { text('E-Way Bill No', M + 190, H - 108, F, 9, GREY); text(ewb, M + 270, H - 108, FB, 9); }
  try {
    const src = ($('#logo') || {}).src || '';
    if (src.startsWith('data:image/')){
      const bytes = Uint8Array.from(atob(src.split(',')[1]), ch => ch.charCodeAt(0));
      const img = /^data:image\/png/.test(src) ? await doc.embedPng(bytes) : await doc.embedJpg(bytes);
      const hh = 44, ww = Math.min(170, img.width * hh / img.height), hh2 = ww * img.height / img.width;
      page.drawImage(img, {x: W - M - ww, y: H - 34 - hh2, width: ww, height: hh2});
    }
  } catch(e){}

  // Billed by / Billed to
  let y = H - 124;
  const boxW = (BW - 10) / 2, pad = 14, lh = 12.5;
  const partyLines = (p, isUs) => {
    const L = [];
    L.push({t: p.name || '', f: FB});
    for (const ln of wrap(p.address || '', F, 9, boxW - 2 * pad)) if (ln) L.push({t: ln});
    const st = GST_STATES[p.state] || '';
    if (st || p.pin) L.push({t: [st, 'India'].filter(Boolean).join(', ') + (p.pin ? ' - ' + p.pin : '')});
    if (p.gstin) L.push({k: 'GSTIN:', t: String(p.gstin).toUpperCase()});
    if (p.pan) L.push({k: 'PAN:', t: p.pan});
    if (isUs && p.email) L.push({k: 'Email:', t: p.email});
    if (!isUs && p.email) L.push({k: 'Email:', t: p.email});
    if (!isUs && p.phone) L.push({k: 'Phone:', t: p.phone});
    return L;
  };
  const us = partyLines({name: cfg.name, address: cfg.address, state: cfg.state, pin: cfg.pin, gstin: cfg.gstin, pan: cfg.pan, email: cfg.email}, true);
  const them = partyLines({...cl, name: String(cl.name || '').toUpperCase()}, false);
  const boxH = 40 + Math.max(us.length, them.length) * lh + 6;
  [[us, dc ? 'Consignor' : 'Billed By', M], [them, dc ? 'Consignee' : 'Billed To', M + boxW + 10]].forEach(([L, title, x]) => {
    rrect(x, y, boxW, boxH, SOFT);
    text(title, x + pad, y - 26, F, 14, BLUE);
    L.forEach((ln, i) => { const yy = y - 43 - i * lh; let cx = x + pad; if (ln.k) cx = text(ln.k + ' ', cx, yy, FB, 9); text(ln.t, cx, yy, ln.f || F, 9); });
  });
  y -= boxH + 14;
  // Shipped To and Transport Details (tax invoices)
  const sh = shipTo(b), tl = transportLines(b);
  if (sh || tl.length){
    const shipL = sh ? partyLines({...sh, name: String(sh.name || '').toUpperCase(), pan: '', email: ''}, false) : [];
    const rows2 = Math.max(shipL.length, tl.length);
    const bh2 = 40 + rows2 * lh + 6;
    if (sh){ const x = M; rrect(x, y, boxW, bh2, SOFT); text('Shipped To', x + pad, y - 26, F, 14, BLUE);
      shipL.forEach((ln, i) => { const yy = y - 43 - i * lh; let cx = x + pad; if (ln.k) cx = text(ln.k + ' ', cx, yy, FB, 9); text(ln.t, cx, yy, ln.f || F, 9); }); }
    if (tl.length){ const x = sh ? M + boxW + 10 : M, w = sh ? boxW : BW; rrect(x, y, w, bh2, SOFT); text('Transport Details', x + pad, y - 26, F, 14, BLUE);
      tl.forEach(([k, v], i) => { const yy = y - 43 - i * lh; text(k, x + pad, yy, FB, 9); text(v, x + pad + 92, yy, F, 9); }); }
    y -= bh2 + 14;
  }

  // Items table
  const cols = dc ? [['#',22,'l'],['Item',300,'l'],['HSN/SAC',72,'c'],['Quantity',75,'c'],['Unit',70,'c']] : pf
    ? (inter ? [['#',22,'l'],['Item',190,'l'],['Quantity',45,'c'],['Rate',45,'c'],['GST Rate',35,'c'],['Amount',70,'c'],['IGST',62,'c'],['Total',70,'c']]
             : [['#',22,'l'],['Item',160,'l'],['Quantity',42,'c'],['Rate',42,'c'],['GST Rate',33,'c'],['Amount',66,'c'],['CGST',54,'c'],['SGST',54,'c'],['Total',66,'c']])
    : (inter ? [['#',22,'l'],['Item',140,'l'],['HSN/SAC',50,'c'],['Quantity',45,'c'],['Unit',32,'c'],['Rate',40,'c'],['Amount',65,'c'],['GST Rate',32,'c'],['IGST',50,'c'],['Total',63,'c']]
             : [['#',20,'l'],['Item',120,'l'],['HSN/SAC',46,'c'],['Quantity',42,'c'],['Unit',28,'c'],['Rate',38,'c'],['Amount',62,'c'],['GST Rate',30,'c'],['CGST',48,'c'],['SGST',48,'c'],['Total',57,'c']]);
  const xs = []; { let x = M; for (const c of cols){ xs.push(x); x += c[1]; } }
  const FS = 8.5;
  const headerRow = () => {
    const hh = 38;
    rrect(M, y, BW, hh, HEAD, 6); page.drawRectangle({x: M, y: y - hh, width: BW, height: 8, color: HEAD});
    cols.forEach(([lab, w, al], i) => { if (lab === '#') return; const ls = wrap(lab, FB, FS, w - 6); ls.forEach((l, j) => { const yy = y - 16 - j * 11; if (al === 'l') text(l, xs[i] + 4, yy, FB, FS, WHITE); else textC(l, xs[i] + w / 2, yy, FB, FS, WHITE); }); });
    y -= hh;
  };
  const newPage = () => { page = doc.addPage([W, H]); y = H - M; };
  headerRow();
  const half = v => r2(v / 2);
  calc.rows.forEach((r, i) => {
    const it = r.it, itemW = cols[1][1] - 8;
    const nameLines = wrap(it.name || '', F, 9, itemW);
    const extra = [];
    if (it.size) extra.push({k: 'Dimensions: ', t: it.size});
    for (const ln of wrap(it.desc || '', F, 8.5, itemW)) if (ln) extra.push({t: ln});
    const rowH = 10 + nameLines.length * 12 + (extra.length ? 8 + extra.length * 12 : 0) + 8;
    if (y - rowH < 70){ newPage(); headerRow(); }
    page.drawRectangle({x: M, y: y - rowH, width: BW, height: rowH, color: i % 2 ? SOFT : ROWA});
    const top = y - 16;
    text((i + 1) + '.', M + 6, top, F, 9);
    nameLines.forEach((l, j) => text(l, xs[1] + 4, top - j * 12, F, 9));

// payments/<id>: no, num, date, client{name,gstin,...}, amount, tds, mode, ref, bank, kind, billId (proforma or tax invoice it is for, or ''), note, by.
const PAY_KINDS = {advance:'Advance', full:'Balance clearance', part:'Part payment', other:'Other'};
const PAY_KIND_OPTS = ['advance', 'full', 'part'];
const PAY_MODES = ['Bank transfer (NEFT / RTGS / IMPS)', 'UPI', 'Cheque', 'Cash', 'Other'];
// The detail asked for each mode (UPI: account number, as Raj asked).
const payRefLabel = mode => /UPI/.test(mode || '') ? 'Account number / UPI ID' : /Cheque/.test(mode || '') ? 'Cheque no.' : /Bank/.test(mode || '') ? 'UTR / reference no.' : '';

function nextPayNo(){
  const c = billCfg(), prefix = String(c.rcPrefix || '').trim(); let n = n0(c.rcNext) || 1;
  for (const p of S.payments.values()) if (String(p.no || '').startsWith(prefix)){ const m = /(\d+)$/.exec(String(p.no).slice(prefix.length)); if (m) n = Math.max(n, +m[1] + 1); }
  return {no: prefix + n, num: n};
}
const paySettled = p => r2(n0(p.amount) + n0(p.tds));
// Payments that count towards a document: its own, and for a tax invoice also those taken on the proforma it came from.
function paymentsFor(b){
  const ids = new Set([b.id]); if (b.type === 'invoice' && b.fromId) ids.add(b.fromId);
  return [...S.payments.values()].filter(p => p.billId && ids.has(p.billId)).sort((a, c) => String(a.date || '').localeCompare(String(c.date || '')) || n0(a.createdAt) - n0(c.createdAt));
}
function billPaid(b, exceptId){
  const ps = paymentsFor(b).filter(p => p.id !== exceptId), got = r2(ps.reduce((a, p) => a + paySettled(p), 0)), total = billCalc(b).total, bal = r2(total - got);
  return {ps, got, total, bal, status: got <= 0 ? 'unpaid' : bal <= 0.5 ? 'paid' : 'part'};
}

// Everything filled in, as [label, value] pairs ('photo' marks where the photos go). Used on screen and on the A6 sheet.
function smpFactList(s){
  const rows = [];
  const add = (k, v) => { if (v != null && v !== '') rows.push([k, String(v)]); };
  const yn = v => v === 'yes' ? 'Yes' : v === 'no' ? 'No' : '';
  if (s.make || s.prod){
    add('Sample', SMP_MAKE[s.make]); add('Product', smpProd(s) === 'mono' ? 'Mono carton' : BOX[s.boxType]);
    add('Dimension', smpSize(s));
    if ((s.picIds || []).length) rows.push(['photo', '']);
    else if (s.picsDeleted) add('Photo of the product', (s.picsDeleted === 1 ? 'Photo' : s.picsDeleted + ' photos') + ' deleted when the sample was marked ready');
    if (smpProd(s) === 'rigid') add('Board thickness', s.board ? s.board + ' mm' : '');
    if (smpProd(s) === 'mono') add('Paper GSM', s.gsm ? fmtN(s.gsm) : '');
    if (smpProd(s) === 'rigid') add('Printing', yn(s.print));
    if (smpPrinted(s)) add(smpProd(s) === 'mono' ? 'Printing file' : 'Artwork', [s.artGot === 'yes' ? 'Received' : s.artGot === 'no' ? 'Not received yet' : '', s.artNote].filter(Boolean).join(' · '));
    s = fixCoat({...s});
    add('Coating', coatName(s.lam) || 'No coating');
    add('Special effects', [(s.fx || []).map(k => (SMP_FX.find(x => x[0] === k) || [k, k])[1]).join(', '), s.fxNote].filter(Boolean).join(' · '));
    if (smpProd(s) === 'mono') add('Laser cut', s.make === 'die' ? 'No (die made)' : yn(s.laser));
    if (smpProd(s) === 'rigid') add('Inserts', s.insert || 'None');
  }
  return rows;
}
function smpFacts(s){
  const rows = smpFactList(s).map(([k, v]) => k === 'photo'
    ? h('div',{class:'smpfact', style:'grid-column:1/-1'}, h('span',{class:'sub'}, 'Photo of the product (tap to see it big) · deleted automatically when the sample is marked ready'), picThumbs(s.picIds.map(id => ({id}))))
    : h('div',{class:'smpfact'}, h('span',{class:'sub'}, k), h('span',{}, v)));
  return rows.length ? h('div',{class:'smpfacts'}, rows) : null;
}
// ---- A6 sheet for the person making the sample (Raj): one page, print-ready, downloads as a PDF ----
async function buildSamplePdf(s){
  const {PDFDocument, StandardFonts, rgb} = await loadPdfLib();
  const doc = await PDFDocument.create(); doc.setTitle('Sample ' + s.id + ' · ' + (s.client || '')); doc.setAuthor('Firstbox');
  const F = await doc.embedFont(StandardFonts.Helvetica), FB = await doc.embedFont(StandardFonts.HelveticaBold);
  const W = 297.64, H = 419.53, M = 16, BW = W - 2 * M, HT = 2000;   // A6 portrait
  const OR = rgb(0.92, 0.38, 0.137), SOFT = rgb(0.992, 0.922, 0.875), INK = rgb(0.1, 0.1, 0.12), GREY = rgb(0.42, 0.42, 0.45), LINE = rgb(0.88, 0.84, 0.8);
  let page = doc.addPage([W, HT]); let y = HT - M;
  const tw = (t, f, z) => f.widthOfTextAtSize(pdfSafe(t), z);
  const text = (t, x, yy, f, z, c) => page.drawText(pdfSafe(t), {x, y: yy, size: z, font: f, color: c || INK});
  const wrap = (t, f, z, w) => { const out = []; for (const para of String(t == null ? '' : t).split('\n')){ let cur = ''; for (const word of para.split(/\s+/).filter(Boolean)){ const nx = cur ? cur + ' ' + word : word; if (tw(nx, f, z) <= w || !cur) cur = nx; else { out.push(cur); cur = word; } } out.push(cur); } return out; };
  // header: logo + sample number
  try { const lg = await doc.embedJpg(Uint8Array.from(atob(LOGO().split(',')[1]), ch => ch.charCodeAt(0))); const lh = 20, lw = lg.width * lh / lg.height; page.drawImage(lg, {x: M, y: y - lh, width: lw, height: lh}); } catch(e){}
  text('SAMPLE', W - M - tw('SAMPLE', F, 7), y - 7, F, 7, GREY);
  text(s.id, W - M - tw(s.id, FB, 15), y - 21, FB, 15, OR);
  y -= 27; page.drawRectangle({x: M, y, width: BW, height: 1.6, color: OR}); y -= 16;
  // client + date
  for (const ln of wrap(s.client || '—', FB, 13, BW)){ text(ln, M, y, FB, 13); y -= 15; }
  text('Date: ' + (fmtDate(s.date) || '—') + (s.by ? '   ·   Added by ' + s.by : ''), M, y, F, 7.5, GREY); y -= 11;
  // what to make, in an orange band
  const what = smpWhat(s) || 'Sample', wl = wrap(what, FB, 10, BW - 12);
  page.drawRectangle({x: M, y: y - wl.length * 12 - 6, width: BW, height: wl.length * 12 + 10, color: SOFT});
  wl.forEach((ln, i) => text(ln, M + 6, y - 9 - i * 12, FB, 10)); y -= wl.length * 12 + 16;
  // every answer
  const LW = 76, VW = BW - LW - 4;
  const rows = smpFactList(s).filter(([k]) => !['Sample', 'Product'].includes(k));   // already in the orange band
  for (const [k, v] of rows){
    if (k === 'photo') continue;
    const vl = wrap(v, FB, 8.5, VW), hgt = Math.max(1, vl.length) * 10.5 + 5;
    wrap(k, F, 7.5, LW - 4).forEach((ln, i) => text(ln, M, y - 8 - i * 9, F, 7.5, GREY));
    vl.forEach((ln, i) => text(ln, M + LW, y - 8 - i * 10.5, FB, 8.5));
    y -= hgt; page.drawRectangle({x: M, y: y + 1, width: BW, height: 0.5, color: LINE});
  }
  if (!rows.length && s.kind) { text(SMP_KIND[s.kind] || '', M, y - 8, FB, 8.5); y -= 14; }
  // photos of the product
  const pics = [];
  for (const id of s.picIds || []){ const src = await loadPic(id); if (!src) continue; try { pics.push(await doc.embedJpg(Uint8Array.from(atob(src.split(',')[1]), ch => ch.charCodeAt(0)))); } catch(e){} }
  if (pics.length){
    y -= 8; text('Photo of the product', M, y, F, 7.5, GREY); y -= 5;
    const gap = 6, cw = (BW - gap * (pics.length - 1)) / pics.length, mh = pics.length === 1 ? 150 : 110;
    let rowH = 0; pics.forEach((im, i) => { const k = Math.min(cw / im.width, mh / im.height), w = im.width * k, hh = im.height * k; rowH = Math.max(rowH, hh);
      page.drawImage(im, {x: M + i * (cw + gap) + (cw - w) / 2, y: y - hh, width: w, height: hh}); });
    y -= rowH + 4;
  }
  // notes (and the older free-text details)
  const notes = [s.details, s.notes].filter(Boolean).join('\n');
  if (notes){
    y -= 8; const nl = wrap(notes, F, 8.5, BW - 12), nh = nl.length * 10.5 + 18;
    page.drawRectangle({x: M, y: y - nh, width: BW, height: nh, borderColor: LINE, borderWidth: 0.8});
    text('Notes', M + 6, y - 10, FB, 7.5, GREY); nl.forEach((ln, i) => text(ln, M + 6, y - 21 - i * 10.5, F, 8.5)); y -= nh;
  }
  // sign-off
  y -= 22; const third = (BW - 16) / 3;
  ['Made by', 'Date', 'Checked by'].forEach((lab, i) => { const x = M + i * (third + 8); page.drawRectangle({x, y, width: third, height: 0.7, color: INK}); text(lab, x, y - 9, F, 7, GREY); });
  y -= 22; page.drawRectangle({x: M, y: y - 1, width: 9, height: 9, borderColor: INK, borderWidth: 0.8}); text('Sample ready', M + 14, y + 0.5, FB, 8.5); y -= 6;
  // fit on one A6 page: crop if it fits, otherwise shrink to fit
  const used = HT - y + 14, foot = 'Firstbox · Sample ' + s.id + ' · printed ' + fmtDate(today());
  if (used <= H){ page.setMediaBox(0, HT - H, W, H); page.setCropBox(0, HT - H, W, H); text(foot, M, HT - H + 9, F, 6, GREY); }
  else {
    const emb = await doc.embedPage(page, {left: 0, bottom: HT - used, right: W, top: HT}); doc.removePage(0);
    page = doc.addPage([W, H]); const k = (H - 16) / used;
    page.drawPage(emb, {x: (W - W * k) / 2, y: H - used * k, xScale: k, yScale: k}); text(foot, M, 7, F, 6, GREY);
  }
  return doc.save();
}
async function downloadSamplePdf(s, btn){
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Making PDF…';
  const fail = t => { btn.textContent = t; setTimeout(() => btn.textContent = label, 2500); };
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (!dl){ fail('Can’t download here'); return; }
    let bytes; try { bytes = await buildSamplePdf(s); } catch(e){ console.error(e); fail('Couldn’t make PDF'); return; }
    const name = ('Sample ' + s.id + ' ' + (s.client || '')).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim() + '.pdf';
    try { const res = await dl.save({filename: name, data: new Blob([bytes], {type:'application/pdf'})}); btn.textContent = res && res.path ? 'Saved' : 'Downloaded'; setTimeout(() => btn.textContent = label, 2000); return; }
    catch(e){ if (e && e.code === 'declined') return; fail('Download didn’t work'); }
  } finally { btn.disabled = false; if (btn.textContent === 'Making PDF…') btn.textContent = label; }
}
// "Mark ready" — when the sample has photos, a second tap is needed, because marking it ready deletes them.
function readyBtn(s){
  const n = (s.picIds || []).length; let t;
  const b = h('button',{type:'button', class:'btn small primary', onclick:e => {
    e.stopPropagation();
    if (n && !b.classList.contains('armed')){
      b.classList.add('armed'); b.textContent = 'Ready? ' + (n === 1 ? 'Photo' : 'Photos') + ' will be deleted — tap again';
      t = setTimeout(() => { b.classList.remove('armed'); b.textContent = 'Mark ready'; }, 5000); return;
    }
    clearTimeout(t); markSample(s, true);
  }}, 'Mark ready');
  return b;
}

  const all = [...S.samples.values()], todo = all.filter(s => s.status !== 'ready'), ready = all.filter(s => s.status === 'ready');
  const month = today().slice(0, 7);
  root.append(h('div',{class:'kpis'},
    kpi('To make', String(todo.length), 'samples waiting'),
    kpi('Mono cartons', String(todo.filter(s => smpProd(s) === 'mono').length), 'waiting'),
    kpi('Rigid boxes', String(todo.filter(s => smpProd(s) === 'rigid').length), 'waiting'),
    kpi('Ready this month', String(ready.filter(s => String(s.readyAt || '').startsWith(month)).length), new Date().toLocaleDateString('en-IN',{month:'long'}))));
  const tab = S.smpTab || 'todo';
  const t = (k, n, c) => h('button',{type:'button', class:'jctab', 'aria-current': tab === k ? 'page' : 'false', onclick:() => { S.smpTab = k; renderSamples(); }}, n + ' (' + c + ')');
  const search = h('input',{type:'search', placeholder:'Search sample no. or client', value:S.smpQ || '', style:'flex:1 1 240px'});
  const tbox = h('div',{});
  root.append(h('div',{class:'row', style:'margin-bottom:10px'}, h('nav',{class:'jump', 'aria-label':'Show', style:'position:static;padding:4px'}, t('todo', 'To make', todo.length), t('ready', 'Ready', ready.length), t('all', 'All', all.length)), search), tbox);
  const draw = () => {
    const q = String(S.smpQ || '').trim().toLowerCase();
    const list = (tab === 'todo' ? todo.sort(smpOrder) : tab === 'ready' ? ready.sort((a, b) => String(b.readyAt || '').localeCompare(String(a.readyAt || ''))) : all.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || n0(b.createdAt) - n0(a.createdAt)))
      .filter(s => !q || [s.id, s.id.replace('-', ''), s.client, s.item, BOX[s.boxType], smpSpec(s), s.notes, s.details].join(' ').toLowerCase().includes(q));
    tbox.replaceChildren(list.length ? sampleRows(list) : h('div',{class:'card empty'}, q ? 'No samples match.' : tab === 'todo' ? 'No samples to make right now.' + (edit ? ' Press “+ New sample” to add one.' : '') : tab === 'ready' ? 'No samples marked ready yet.' : 'No samples yet.'));
  };
  search.addEventListener('input', e => { S.smpQ = e.target.value; draw(); });
  draw();
}

// ---------- Clients & leads (Raj): the sales team's sheet of clients, talks, follow-ups and quotes ----------
// leads/<id>: {id, name, contact, phone, email, city, source, sourceNote, product (boxType), qty, requirement, stage,
//   nextFollow (date), followNote, log:[{id, at, date, by, kind, text}], quotes:[{id, date, by, ...details, rows:[{qty, price}], message}],
//   by, createdAt, updatedAt}. Owner + sales read and write; only the owner deletes. Everyone in sales sees every lead (Raj).
const LEAD_STAGES = [['new','New enquiry'], ['req','Requirement taken'], ['quote','Quote sent'], ['nego','Negotiating'], ['pf','Proforma sent'], ['won','Won – order received'], ['hold','On hold'], ['lost','Lost']];
const LEAD_CLOSED = new Set(['won', 'lost']);
const STAGE_FOLLOW = {new:1, req:2, quote:3, nego:2, pf:3, hold:15};   // automatic next follow-up, in days, when the stage changes
const LEAD_SOURCES = [['online','Online enquiry'], ['indiamart','IndiaMART'], ['reference','Reference'], ['other','Other']];
const LOG_KINDS = [['call','Call'], ['whatsapp','WhatsApp'], ['meeting','Meeting'], ['visit','Visit'], ['email','Email'], ['note','Note']];
const QUOTE_PRINT = [['none','No printing'], ['1c','1 colour'], ['2c','2 colour'], ['4c','4 colour (CMYK)'], ['4c+p','4 colour + Pantone'], ['pantone','Pantone only']];
const stageName = k => (LEAD_STAGES.find(s => s[0] === k) || [k, k || '—'])[1];
const sourceName = k => (LEAD_SOURCES.find(s => s[0] === k) || [k, k || '—'])[1];
const canCrm = () => S.role === 'owner' || S.role === 'sales';
const addDays = (d, n) => { const x = new Date((d || today()) + 'T00:00:00'); x.setDate(x.getDate() + n); return ymd(x); };
const myName = () => S.myName || ROLES[S.role]?.n || 'Owner';
const waNumber = p => { let d = String(p || '').replace(/\D/g, ''); if (d.length === 10) d = '91' + d; return d.length >= 11 ? d : ''; };
const money2 = v => '₹' + new Intl.NumberFormat('en-IN',{minimumFractionDigits:2, maximumFractionDigits:2}).format(n0(v));
function saveLead(l){ l.updatedAt = Date.now(); S.leads.set(l.id, l); const snap = clone(l); flush('leads/' + l.id, () => snap); }
function logLead(l, kind, text){ (l.log = l.log || []).push({id: uid(), at: Date.now(), date: today(), by: myName(), kind, text}); }
function setStage(l, stage){
  if (l.stage === stage) return;
  logLead(l, 'stage', 'Stage: ' + stageName(l.stage) + ' → ' + stageName(stage));
  l.stage = stage;
  if (LEAD_CLOSED.has(stage)){ l.nextFollow = ''; l.followNote = ''; }
  else if (STAGE_FOLLOW[stage] && (!l.nextFollow || l.nextFollow < today())) l.nextFollow = addDays(today(), STAGE_FOLLOW[stage]);
}
const lastQuote = l => (l.quotes || [])[(l.quotes || []).length - 1];
const followDue = l => !LEAD_CLOSED.has(l.stage) && l.nextFollow ? daysTo(l.nextFollow) : null;
function followLists(){
  const all = [...S.leads.values()].filter(l => followDue(l) != null).sort((a, b) => String(a.nextFollow).localeCompare(String(b.nextFollow)));
  return {over: all.filter(l => followDue(l) < 0), today: all.filter(l => followDue(l) === 0), soon: all.filter(l => followDue(l) > 0 && followDue(l) <= 7)};
}
const rerenderCrm = () => { if (S.view === 'crm') renderCrm(); if (S.view === 'home') renderHome(); };

// ---- Create a quotation (Raj): the salesperson asks Raj → Raj gives the price → the salesperson sends the ready message ----
// Each quote sits on its lead (`quotes`) with status: 'asked' (waiting for Raj) → 'priced' (Raj gave the price) → 'sent' (sent to the client).
const QSTAT = {asked:'Waiting for price', priced:'Price ready', sent:'Sent to client'};
const qStatus = q => q.status || 'sent';
const allQuotes = () => [...S.leads.values()].flatMap(l => (l.quotes || []).map(q => ({q, l})));
const rajPhone = () => waNumber(billCfg().phone);
// ---- Quotation details (Raj, Nov 2026): asked in the order the sales rep asks the client, sitting with them ----
// A quote holds one or more boxes (`items`); each box can have more than one printing option (the client wants a price for both),
// and Raj gives a price per piece for every quantity × printing option. Older quotes (one box, fields on the quote itself) are read by quoteItems.
const QBOX_TYPES = ['rigid','shoulder','magnetic','slider','mono','corrugated','mdf'];   // Raj: no custom box or printing service here
// MDF boxes (Raj): same questions as a rigid box, plus accessories typed by hand.
const qRigidLike = k => RIGID.has(k) || k === 'mdf';
// Mono cartons (Raj): carton style and paper as a choice + GSM (no pasting question — Raj).
const MONO_STYLES = [['both','Both side flap'], ['self','Self lock'], ['bottom','Bottom lock'], ['custom','Custom shape']];
const MONO_PAPERS = [['sbs','SBS'], ['artcard','Art card'], ['duplex','Duplex'], ['impaper','Imported paper'], ['imkraft','Imported kraft']];
const optName = (list, k) => (list.find(x => x[0] === k) || [, ''])[1];
const qProdName = k => BOX[k] || k || '';
function newQItem(product, qty){
  const unit = (() => { try { return localStorage.getItem('fb-smpUnit') || 'mm'; } catch(e){ return 'mm'; } })();
  return {id: uid(), product: product || '', rows:[{id: uid(), qty: qty ?? null}], l:null, w:null, h:null, unit, board:'', paper:'',
    prints:[{id: uid(), print:'4c', note:''}], lam:'', fx:[], fxNote:'', insert:'', hasVars:'', vars:[], extras:'', prices:{},
    style:'', styleNote:'', paperType:'', gsm:null, fab:[]};
}
function quoteItems(q){
  if (Array.isArray(q.items) && q.items.length) return q.items;
  const rows = (q.rows && q.rows.length ? q.rows : [{qty:null}]).map((r, i) => ({id:'r' + i, qty: r.qty ?? null}));
  const prices = {}; (q.rows || []).forEach((r, i) => { if (r.price != null) prices['p1|r' + i] = r.price; });
  return [{id:'i1', product: q.product || '', rows, l: q.l ?? null, w: q.w ?? null, h: q.h ?? null, unit: q.unit || 'mm', board: q.board || '', paper: q.paper || '',
    prints:[{id:'p1', print: q.print || '', note:''}], lam: q.lam || '', fx: Array.isArray(q.fx) ? q.fx : [], fxNote: q.fxNote || '', insert: q.insert || '',
    hasVars:'', vars:[], extras: q.extras || '', prices}];
}
const qPrice = (it, p, r) => { const v = (it.prices || {})[p.id + '|' + r.id]; return v === '' ? null : v ?? null; };
const printName = p => ((QUOTE_PRINT.find(x => x[0] === p.print) || [, ''])[1] || '') + (p.note ? ' (' + p.note + ')' : '');
const quoteHasPrice = q => quoteItems(q).some(it => Object.values(it.prices || {}).some(v => v != null && v !== ''));
const quoteProducts = q => [...new Set(quoteItems(q).map(it => qProdName(it.product)).filter(Boolean))].join(' + ');
const quoteQtyText = q => quoteItems(q).map(it => it.rows.map(r => r.qty ? fmtN(r.qty) : '').filter(Boolean).join(' / ')).filter(Boolean).map(x => x + ' pcs').join(' + ');

function syncPriceBook(){
  if (S.role !== 'owner' || !S.loaded.jobs || !S.loaded.priceBook) return;
  clearTimeout(pbTimer);
  pbTimer = setTimeout(() => {
    const want = new Map();
    for (const j of S.jobs.values()){
      const price = j.quotePrice; if (price == null || price === '') continue;
      want.set(j.id, {client:j.client || '', item:j.description || '', boxType:j.boxType || '', cat: j.cat || '', l:j.l ?? null, w:j.w ?? null, h:j.h ?? null, qty:j.qty ?? null, pricePc:n0(price), date:j.date || ''});
    }
    for (const [id, e] of want){ const cur = S.priceBook.get(id); if (!cur || stable(cur) !== stable(e)){ S.priceBook.set(id, e); flush('priceBook/' + id, () => e); } }
    for (const id of [...S.priceBook.keys()]) if (!want.has(id)){ S.priceBook.delete(id); removeDoc('priceBook/' + id); }
  }, 1500);
}

function renderJobs(){
  const root = $('#view-jobs'); root.replaceChildren();
  const ready = S.loaded.jobs;
  const all = [...S.jobs.values()].sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')) || n0(b.createdAt) - n0(a.createdAt));
  const months = [...new Set(all.map(j => (j.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const mLabel = m => new Date(m + '-01T00:00:00').toLocaleDateString('en-IN',{month:'long', year:'numeric'});
  const inMonth = j => S.filters.month === 'all' || (j.date||'').startsWith(S.filters.month);

  // summary
  // Totals of costings that have a quoted price: quoted value, estimated cost, profit at quote.
  let count = 0, quoted = 0, value = 0, cost = 0;

    h('div',{class:'head'},

      kpi('Saved calculations', String(count), quoted + ' with a quoted price'),
      kpi('Quoted value', rs(value), 'quoted price × qty'),

// Small delete button for list rows: first tap asks, second tap deletes.
function rowDelete(what, onConfirm){
  const b = h('button',{type:'button', class:'rowdel', title:'Delete ' + what, 'aria-label':'Delete ' + what},
    h('span',{'aria-hidden':'true', style:'display:grid'}));
  b.firstChild.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
  const icon = b.firstChild; let t;
  b.addEventListener('click', async e => {
    e.stopPropagation();
    if (!b.classList.contains('armed')){ b.classList.add('armed'); b.replaceChildren('Delete?'); t = setTimeout(() => { b.classList.remove('armed'); b.replaceChildren(icon); }, 4000); return; }

function makePassword(){
  const words = ['Box','Kite','Lamp','Ink','Foil','Sheet','Board','Gold','Mint','Leaf','Star','Wave','Rose','Sky','Pine','Moon'];
  const r = new Uint32Array(3); crypto.getRandomValues(r);
  return words[r[0] % words.length] + '-' + String(1000 + r[1] % 9000) + '-' + words[r[2] % words.length];
}

const MAKING = {grooving:'Grooving', halfcut:'Half cut'};
// Job card as instructions: one sheet per team, plus a master sheet with everything in work order.
const TEAMS = [
  {k:'design', n:'Designer', note:'notesDesign'},

  {k:'fab', n:'Fabrication team', note:'notesFab'},

const FX_ORDER = ['foil','spotuv','emboss','deboss'];
const hasBoxMaking = c => partsFor(c).includes('board') || partsFor(c).includes('make');

const shSize = s => s.L && s.W ? s.L + ' × ' + s.W + ' in' : '';
const pcs = v => v == null || v === '' ? '' : fmtN(v) + (n0(v) === 1 ? ' pc' : ' pcs');

const pastelNames = c => [...new Set(c.sheets.flatMap(s => String(s.ups || '').split(',').map(x => x.replace(/×.*$/, '').trim()).filter(x => x && !/^\d+\s*ups?$/i.test(x))))];
const sheetCount = (c, name) => { const s = c.sheets.find(x => x.name === name); return s ? s.count : null; };
const totalSheets = c => c.sheets.reduce((a, s) => a + n0(s.count), 0);
// Pieces per sheet: "8 ups" → 8, "Top × 2, Bottom × 2" or variants "A × 2 (…), B × 2 (…)" → 4.
const upsNum = sh => { const t = String(sh.ups || ''), m = [...t.matchAll(/×\s*(\d+)/g)].reduce((a, x) => a + +x[1], 0); return m || parseInt(t, 10) || 0; };
// Repeat jobs (Raj): every tool from the earlier job is "Reuse old" unless marked New or Correction on the job card.
const TOOL_OPTS = {reuse:'Reuse old', fix:'Correction', new:'Make new'};
function toolsOf(c){
  const T = [], D = dieWork(c), P = partsFor(c), isP = sh => D.pastels.includes(sh);
  c.sheets.forEach(sh => T.push({key:'plate:' + sh.name, group:'Plates', label:'Plates – ' + sh.name + (sheetColours(sh) ? ' (' + sheetColours(sh) + ')' : ''), opts:['reuse','new']}));
  c.sheets.forEach(sh => T.push({key:'die:' + sh.name, group:'Dies', label:(isP(sh) ? 'Pastel die' : 'Die') + ' – ' + sh.name, opts:['reuse','fix','new']}));
  if (P.includes('board')) c.boards.forEach(b => T.push({key:'bdie:' + b.type + '|' + b.thick, group:'Dies', label:'Board die – ' + [b.type, b.thick ? b.thick + ' mm' : ''].filter(Boolean).join(' '), opts:['reuse','fix','new']}));
  fxSorted(c).forEach(f => T.push({key:(f.kind === 'spotuv' ? 'uv:' : 'block:') + f.kind + ':' + (f.part || '') + ':' + (f.sheet || ''), group: f.kind === 'spotuv' ? 'Spot UV positive' : 'Blocks',
    label:(f.kind === 'spotuv' ? 'Spot UV positive' : FX[f.kind] + ' block') + (f.part ? ' – ' + f.part : f.sheet ? ' – ' + f.sheet : ''), opts:['reuse','new']}));
  c.acc.filter(a => a.name && !/magnet/i.test(a.name)).forEach(a => T.push({key:'x:' + a.name, group:'Extras', label:a.name + ' (dies / plates)', opts:['reuse','fix','new']}));

}
const isRepeat = c => c.repeat === 'yes';
const toolChoice = (c, key) => !isRepeat(c) ? null : ((c.reuse && c.reuse.tools && c.reuse.tools[key]) || {choice:'reuse'});

function toolText(c, key, noun){
  const t = toolChoice(c, key); if (!t) return '';
  const from = c.repeatOf ? ' from ' + c.repeatOf : '';
  return t.choice === 'new' ? 'New ' + noun + (t.note ? ': ' + t.note : '') : t.choice === 'fix' ? 'Correction: ' + (t.note || 'see designer') : 'Old ' + noun + from;

const artSame = c => !c.reuse || c.reuse.art !== 'changed';

  const reuse = [...new Set(by('reuse').map(t => GN[t.group] || t.group))], fix = by('fix').map(t => t.label + (toolChoice(c, t.key).note ? ' (' + toolChoice(c, t.key).note + ')' : '')), nw = by('new').map(t => t.label);

    reuse.length ? 'Reuse: ' + reuse.join(', ') : '', fix.length ? 'Correction: ' + fix.join('; ') : '', nw.length ? 'New: ' + nw.join(', ') : ''].filter(Boolean).join(' · ');

// What the die team cuts: rigid and MDF paste pastels on board; mono cartons and corrugated are cut as boxes.
function dieWork(c){

  const isP = sh => c.boxType === 'mdf' || (PASTELS[c.boxType] || []).some(n => (sh.ups || '').includes(n));
  return {pasted, pastels: pasted ? c.sheets.filter(isP) : [], others: pasted ? c.sheets.filter(sh => !isP(sh)) : [], boards: partsFor(c).includes('board') ? c.boards : []};

const fxSorted = c => [...c.fx].filter(f => f.kind).sort((a, b) => FX_ORDER.indexOf(a.kind) - FX_ORDER.indexOf(b.kind));

// ---------- Stock & inventory ----------
// Items live in `stock/<id>`; every stock in / out is a row in `stockLog/<id>`. On-hand qty is kept on the item.
const SCATS = {
  paper:{n:'Paper & card', unit:'sheets', fields:['name','gsm','size'], ph:'e.g. Art paper'},
  board:{n:'Mill / kappa board', unit:'sheets', fields:['name','thick','size'], ph:'e.g. Grey back'},
  lam:{n:'Lamination rolls', unit:'kg', fields:['name','width'], ph:'e.g. Thermal matte'},
  foil:{n:'Foil', unit:'rolls', fields:['name','width'], ph:'e.g. Gold'},
  acc:{n:'Accessories', unit:'pcs', fields:['name','spec'], ph:'e.g. Magnet, Ribbon'},
  insert:{n:'Insert material', unit:'sheets', fields:['name','thick','spec'], ph:'e.g. EVA foam black'},
  other:{n:'Other', unit:'pcs', fields:['name','spec'], ph:'e.g. Glue, Packing cartons'}
};
const normS = s => String(s || '').toLowerCase().replace(/[^a-z0-9.]/g, '');
const sameSize = (a, b) => !n0(a.L) || !n0(a.W) || !n0(b.L) || !n0(b.W) || (n0(a.L) === n0(b.L) && n0(a.W) === n0(b.W)) || (n0(a.L) === n0(b.W) && n0(a.W) === n0(b.L));
function stockLabel(it){
  if (!it) return 'Unknown item';
  return [it.name || SCATS[it.cat]?.n || 'Item', it.gsm ? it.gsm + ' GSM' : '', it.thick ? it.thick + ' mm' : '', n0(it.L) && n0(it.W) ? it.L + ' × ' + it.W + ' in' : '', it.width ? it.width + ' in wide' : '', it.spec || ''].filter(Boolean).join(' · ');
}
const stockSorted = () => [...S.stock.values()].sort((a, b) => Object.keys(SCATS).indexOf(a.cat) - Object.keys(SCATS).indexOf(b.cat) || stockLabel(a).localeCompare(stockLabel(b)));
function stockSel(value, attrs){
  const s = h('select', attrs, h('option',{value:''},'Not in stock list'),
    Object.entries(SCATS).map(([k, C]) => { const its = stockSorted().filter(i => i.cat === k); return its.length ? h('optgroup',{label:C.n}, its.map(i => h('option',{value:i.id}, stockLabel(i)))) : null; }));
  s.value = value && S.stock.has(value) ? value : ''; return s;
}
function saveStockItem(it){ it.updatedAt = Date.now(); S.stock.set(it.id, clone(it)); const snap = clone(it); flush('stock/' + it.id, () => snap); }
// Records one movement and changes the on-hand quantity. delta is + for stock in, − for stock out.
function moveStock(itemId, delta, o){
  const it = S.stock.get(itemId); if (!it || !delta) return null;
  const cur = clone(it); cur.qty = Math.round((n0(cur.qty) + delta) * 1000) / 1000; saveStockItem(cur);
  const row = {id: uid(), itemId, qty: delta, type: o.type, date: o.date || today(), note: o.note || '', jobCard: o.jobCard || '', at: Date.now(), after: cur.qty};
  S.slog.set(row.id, row); flush('stockLog/' + row.id, () => clone(row));
  return row;
}
// What a job card needs from stock, matched to stock items where possible.
// Paper and board by printed / board sheets; magnets, ribbon and other accessories per box × qty;
// lamination roll in kg (sheet area ÷ 1552 ÷ the roll's divisor); foil by colour (quantity typed on the job card).
function cardNeeds(c){
  const out = [], qty = n0(c.qty), its = [...S.stock.values()];
  const find = (cat, test) => its.filter(i => i.cat === cat && test(i));
  const words = s => String(s || '').toLowerCase().split(/[^a-z0-9.]+/).filter(w => w && !['lamination','roll','normal','foil','–','-'].includes(w));
  (c.sheets || []).forEach(s => { if (!n0(s.count)) return;
    const m = find('paper', i => (normS(i.name) === normS(s.paper) || (normS(s.paper) && normS(i.name).includes(normS(s.paper)))) && (!i.gsm || !s.gsm || n0(i.gsm) === n0(s.gsm)) && sameSize(i, s))[0];
    out.push({key:'s:' + s.name, kind:'Paper', label:[s.name, s.paper, s.gsm ? s.gsm + ' GSM' : '', s.L && s.W ? s.L + ' × ' + s.W + ' in' : ''].filter(Boolean).join(' · '), itemId: m ? m.id : '', qty: n0(s.count), unit:'sheets'}); });
  if (partsFor(c).includes('board')) (c.boards || []).forEach((b, k) => { if (!n0(b.count)) return;
    const col = (String(b.type).match(/grey|gray|white|black/i) || [''])[0].toLowerCase().replace('gray', 'grey');
    const m = find('board', i => (col ? normS(i.name).includes(col) : true) && (!i.thick || !b.thick || parseFloat(i.thick) === parseFloat(b.thick)) && sameSize(i, b))[0];
    out.push({key:'b:' + k, kind:'Board', label:['Kappa board', b.type, b.thick ? b.thick + ' mm' : '', b.L && b.W ? b.L + ' × ' + b.W + ' in' : ''].filter(Boolean).join(' · '), itemId: m ? m.id : '', qty: n0(b.count), unit:'sheets'}); });
  if (partsFor(c).includes('finish') && /lamination/i.test(c.coat || '')){
    const r = ratesSorted().find(x => x.category === 'Lamination' && normS(x.name) === normS(c.coat));
    const div = r ? n0(r.sqmPerKg) : n0((S.shared.lam || {})[normS(c.coat)]), area = (c.sheets || []).reduce((a, s) => a + n0(s.L) * n0(s.W) * n0(s.count), 0);
    const kg = div && area ? Math.ceil(area / 1552 / div * 10) / 10 : null;
    const cw = words(c.coat), minSide = Math.min(...(c.sheets || []).map(s => Math.min(n0(s.L) || 99, n0(s.W) || 99)));
    const cands = find('lam', i => words(i.name).length && words(i.name).every(w => cw.includes(w)));
    const m = cands.filter(i => !n0(i.width) || n0(i.width) >= minSide).sort((a, b) => n0(a.width) - n0(b.width))[0] || cands[0];
    out.push({key:'lam', kind:'Lamination', label:'Lamination roll · ' + String(c.coat).replace(/^lamination\s*[–-]\s*/i, '') + (minSide < 99 ? ' · at least ' + minSide + ' in wide' : ''), itemId: m ? m.id : '', qty: kg, unit:'kg'});
  }
  if (partsFor(c).includes('finish')) (c.fx || []).forEach((f, k) => { if (f.kind !== 'foil') return;
    const col = normS(f.colour);
    const m = col ? find('foil', i => normS(i.name).includes(col) || col.includes(normS(i.name)))[0] : null;
    out.push({key:'f:' + k, kind:'Foil', label:'Foil · ' + (f.colour || 'colour not set') + [f.sheet ? ' · ' + f.sheet : '', f.part ? ' · ' + f.part : ''].join(''), itemId: m ? m.id : '', qty: null, unit: m ? m.unit : 'rolls'}); });
  if (partsFor(c).includes('acc')) (c.acc || []).forEach((a, k) => { if (!a.name || a.perBox == null || a.perBox === '' || !qty) return;
    const w = normS(a.name).replace(/s$/, '');
    const m = find('acc', i => normS(i.name).includes(w) || w.includes(normS(i.name).replace(/s$/, '')))[0];
    out.push({key:'a:' + k, kind:'Accessory', label: a.name + ' (' + a.perBox + ' per box × ' + fmtN(qty) + ')', itemId: m ? m.id : '', qty: n0(a.perBox) * qty, unit: m ? m.unit : 'pcs'}); });
  return out;
}
// The job card's lines after your own changes on its Materials & stock tab (other stock item, other qty, extra lines).
function cardLines(c){
  const pick = c.stockPick || {}, q = c.stockQty || {};
  const lines = cardNeeds(c).map(n => ({...n, auto:true, itemId: n.key in pick ? pick[n.key] : n.itemId, qty: q[n.key] != null ? q[n.key] : n.qty, calcQty: n.qty}));
  (c.stockExtra || []).forEach((x, i) => lines.push({key:'x:' + i, kind:'Other', label: x.label || 'Other material', itemId: x.itemId || '', qty: x.qty ?? null, unit: (S.stock.get(x.itemId) || {}).unit || '', extra:true, idx:i}));
  return lines;
}
// Stock taken by a job card: {itemId: qty}. Older cards kept a list called `issued`.
function reservedOf(c){
  if (c.reserved && typeof c.reserved === 'object') return {...c.reserved};
  const r = {}; (c.issued || []).forEach(x => { r[x.itemId] = (r[x.itemId] || 0) + n0(x.qty); }); return r;
}
// Takes out (or puts back) only the difference between what the job card needs now and what it already took.
function syncCardStock(c, why){
  if (S.role === 'inventory' || isRO()) return false; // inventory and the manager can’t change job cards; the next job-card or owner session catches up
  if (!S.db || !S.loaded.stock || !S.loaded.cards || !c || !S.cards.has(c.id)) return false;
  const want = {};
  for (const l of cardLines(c)) if (l.itemId && S.stock.has(l.itemId) && n0(l.qty) > 0) want[l.itemId] = Math.round(((want[l.itemId] || 0) + n0(l.qty)) * 1000) / 1000;
  const have = reservedOf(c);
  let changed = 'issued' in c;
  for (const id of new Set([...Object.keys(want), ...Object.keys(have)])){
    const d = Math.round(((want[id] || 0) - (have[id] || 0)) * 1000) / 1000;
    if (!S.stock.has(id)){ if (have[id] != null){ delete have[id]; changed = true; } continue; }
    if (!d) continue;
    moveStock(id, -d, {type: d > 0 ? 'out' : 'ret', jobCard: c.id, note: why || 'Job card changed'});
    if (want[id]) have[id] = want[id]; else delete have[id];
    changed = true;
  }
  if (changed){
    c.reserved = have; delete c.issued; saveCard(c, true);
    if (S.cdraft && S.cdraft.id === c.id && S.cdraft !== c){ S.cdraft.reserved = clone(have); delete S.cdraft.issued; }
  }
  return changed;
}
function syncAllCards(why){
  if (!S.loaded.stock || !S.loaded.cards) return;
  for (const id of [...S.cards.keys()]){ const c = S.cdraft && S.cdraft.id === id ? S.cdraft : clone(S.cards.get(id)); syncCardStock(c, why || 'Stock list changed'); }
}
function releaseCardStock(c){
  const have = reservedOf(c);
  for (const [id, q] of Object.entries(have)) if (S.stock.has(id) && n0(q)) moveStock(id, n0(q), {type:'ret', jobCard: c.id, note:'Job card deleted'});
}
let stockSyncT = null;
function scheduleCardSync(){ clearTimeout(stockSyncT); stockSyncT = setTimeout(() => { if (S.cdraft) syncCardStock(S.cdraft, 'Job card changed'); }, 2500); }
const reservedByItem = () => { const m = {}; for (const c of S.cards.values()) for (const [id, q] of Object.entries(reservedOf(c))){ m[id] = m[id] || {qty:0, cards:[]}; m[id].qty += n0(q); m[id].cards.push(c.id); } return m; };

// Procurement: what to buy, and each upcoming job card's material status.
function procurement(){
  const buy = [], jobs = [];
  for (const it of stockSorted()){
    const q = n0(it.qty), ro = n0(it.reorder);
    if (q < 0) buy.push({label: stockLabel(it), itemId: it.id, qty: -q + ro, unit: it.unit, why: 'Short ' + fmtN(-q, 2) + ' ' + it.unit + ' for job cards' + (ro ? ', plus ' + fmtN(ro) + ' to get back to the reorder level' : ''), level:'bad'});
    else if (ro && q <= ro) buy.push({label: stockLabel(it), itemId: it.id, qty: ro * 2 - q, unit: it.unit, why: 'Down to ' + fmtN(q, 2) + ' ' + it.unit + ' (reorder at ' + fmtN(ro) + ')', level:'warn', soft:true});
  }
  const cards = [...S.cards.values()].sort((a, b) => String(a.due || '9999').localeCompare(String(b.due || '9999')) || String(a.id).localeCompare(String(b.id)));
  for (const c of cards){
    const res = reservedOf(c), rows = [];
    for (const l of cardLines(c)){
      const it = l.itemId && S.stock.get(l.itemId);
      let st, level;
      if (!it){ st = 'Not in stock list: buy ' + (l.qty != null ? fmtN(l.qty, 2) + ' ' + (l.unit || '') : '(qty not set)'); level = 'bad';
        buy.push({label: l.label, qty: l.qty, unit: l.unit, why: 'Needed for ' + c.id + ', not in the stock list', level:'bad', card: c.id}); }
      else if (l.qty == null || !n0(l.qty)){ st = 'Type the quantity needed'; level = 'warn'; }
      else if (n0(it.qty) < 0){ st = 'Taken, but stock is short ' + fmtN(-n0(it.qty), 2) + ' ' + it.unit; level = 'bad'; }
      else { st = 'Ready: ' + fmtN(res[it.id] || l.qty, 2) + ' ' + it.unit + ' set aside'; level = 'ok'; }
      rows.push({label: l.label, item: it ? stockLabel(it) : '', qty: l.qty, unit: it ? it.unit : l.unit, st, level});
    }
    jobs.push({c, rows, bad: rows.filter(r => r.level === 'bad').length, warn: rows.filter(r => r.level === 'warn').length});
  }
  return {buy, jobs};
}

function itemFields(st, redraw){
  const C = SCATS[st.cat] || SCATS.other, F = C.fields, out = [];
  const tx = (label, k, ph, w) => fld(label, h('input',{value: st[k] ?? '', placeholder: ph || '', style: w ? 'width:' + w + 'px' : null, oninput:e => st[k] = e.target.value}));
  const nb = (label, k) => fld(label, numIn(st[k], v => st[k] = v));
  if (st.cat === 'paper'){
    const papers = paperNames();
    out.push(fld('Paper', sel([['','Choose…'], ...papers.map(p => [p, p]), ['__other','Other…']], papers.includes(st.name) ? st.name : st.name ? '__other' : '', {onchange:e => { st.name = e.target.value === '__other' ? '' : e.target.value; if (e.target.value === '__other'){ st._other = true; } redraw && redraw(); }})));
    if (st._other || (st.name && !papers.includes(st.name))) out.push(tx('Paper name', 'name', 'e.g. Imported textured'));
  } else if (st.cat === 'board'){
    out.push(fld('Board', sel([['','Choose…'], ['Grey back','Grey back'], ['White back','White back'], ['Black back','Black back']], st.name || '', {onchange:e => st.name = e.target.value})));
  } else out.push(tx('Name', 'name', C.ph, 200));
  if (F.includes('gsm')) out.push(nb('GSM', 'gsm'));
  if (F.includes('thick')) out.push(st.cat === 'board' ? fld('Thickness', sel([['','—'], ...THICK.map(t => [t, t + ' mm'])], st.thick || '', {onchange:e => st.thick = e.target.value})) : nb('Thickness (mm)', 'thick'));
  if (F.includes('size')) out.push(nb('Sheet L (in)', 'L'), nb('Sheet W (in)', 'W'));
  if (F.includes('width')) out.push(nb('Width (in)', 'width'));
  if (F.includes('spec')) out.push(tx('Details', 'spec', 'colour, size…', 160));
  out.push(tx('Unit', 'unit', C.unit, 90), nb('Reorder at', 'reorder'));
  return out;
}

  const go1 = () => {
    if (!n0(f.qty)){ alert0(wrap, 'Enter the quantity.'); return; }

const DAY = 86400000;
const toT = d => new Date(d + 'T00:00:00').getTime();
const fmtD = d => new Date(d + 'T00:00:00').toLocaleDateString('en-IN',{day:'numeric', month:'short', year:'numeric'});
const histOf = id => ((S.hist.get(id) || {}).entries || []);
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs){ const el = document.createElementNS(SVGNS, tag); for (const [k,v] of Object.entries(attrs || {})) el.setAttribute(k, v); return el; }
function svtext(t, attrs){ const el = sv('text', attrs); el.textContent = t; return el; }
function valueAt(entries, t){ let v = null; for (const e of entries){ if (toT(e.date) <= t) v = e.rate; else break; } return v; }
function niceStep(span, n){ const raw = span / n; const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }

// Saves a price with its date. Same-day changes replace each other; an unchanged price is not logged.
function recordPrice(id, value, date, force){
  if (value == null || !S.db) return;
  date = date || today();
  const doc = {rateId:id, entries: histOf(id).map(e => ({...e}))};
  if (!force){ const prev = doc.entries.filter(e => e.date <= date).pop(); if (prev && prev.rate === value) return; }
  doc.entries = doc.entries.filter(e => e.date !== date);
  doc.entries.push({date, rate:value});
  doc.entries.sort((a,b) => a.date.localeCompare(b.date));
  S.hist.set(id, doc);
  pageSave('rateHistory/' + id, () => doc, 300);
}
function removePrice(id, date){
  const doc = {rateId:id, entries: histOf(id).filter(e => e.date !== date)};
  S.hist.set(id, doc); pageSave('rateHistory/' + id, () => doc, 300);
}
// Colour follows the material: each ticked material keeps its slot until unticked.
function toggleSel(id, on){
  const hs = S.hs;
  if (on){
    if (hs.sel.includes(id) || hs.sel.length >= 6) return;
    const used = new Set(Object.values(hs.slots)); let s = 1; while (used.has(s)) s++;
    hs.slots[id] = s; hs.sel.push(id);
  } else { hs.sel = hs.sel.filter(x => x !== id); delete hs.slots[id]; }
}
function setDefaultSel(){
  const hs = S.hs; hs.sel = []; hs.slots = {};
  ratesSorted().filter(r => r.category === hs.cat && histOf(r.id).length).slice(0, 6).forEach(r => toggleSel(r.id, true));
}

function drawChart(card, groupRates){
  const hs = S.hs, pctMode = hs.mode === 'pct', now = toT(today());

    .map(r => ({r, e: histOf(r.id), slot: hs.slots[r.id]}));
  card.append(h('div',{class:'legend'}, series.map(s => h('span',{class:'lg'}, h('i',{class:'sw', style:'background:var(--s' + s.slot + ')'}), (s.r.name || 'Unnamed') + ' (' + rateUnit(s.r.calc, s.r.unit) + ')'))));
  if (!series.length){
    card.append(h('div',{class:'empty'}, groupRates.some(r => histOf(r.id).length)
      ? 'Tick up to 6 materials in the table below to draw them.'
      : 'No price history in this group yet. Change a rate in the Rate list, or add a past price below, and it will show here.'));
    return;

  db.doc('team/' + myId).onSnapshot(s => {
    const d = s.exists ? s.data() : null, r = d && ROLES[d.role] ? d.role : 'none', was = S.role;
    S.role = r;
    if (ROLES[r]) startTeamData();
    if (was !== r){ if (ROLES[r]) fromHash(); else render(); }
  }, () => { S.role = 'none'; render(); });
}
const barEl = document.querySelector('.bar');
const setBarH = () => document.documentElement.style.setProperty('--barh', barEl.offsetHeight + 'px');
setBarH(); window.addEventListener('resize', setBarH);
boot();
})();
